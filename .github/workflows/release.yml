name: Release

# v1.0.3 ships as a Windows desktop application (.NET MAUI Blazor Hybrid) in a native window.
# MAUI cannot cross-compile to Windows from Linux/macOS, so the whole desktop build runs on
# windows-latest and produces:
#   * AI-CEO-Orchestrator-<version>-win-x64-setup.exe      (Inno Setup installer)
#   * AI-CEO-Orchestrator-<version>-win-x64-portable.zip   (the same app, unpackaged)
#   * AI-CEO-Orchestrator-<version>-win-x64.msix           (best effort, when the MSIX packs)
#   * SHA256 checksums for all of them
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-desktop:
    name: Build Windows desktop app + installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install the MAUI workload
        run: dotnet workload install maui-windows --skip-sign-check

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq "v*") { $version = "1.0.3" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "releasing $version"

      - name: Restore
        run: dotnet restore src/AiCeo.Maui/AiCeo.Maui.csproj -r win-x64

      - name: Unit tests
        shell: pwsh
        run: |
          dotnet test tests/AiCeo.Tests/AiCeo.Tests.csproj -c Release --logger "console;verbosity=minimal"

      # ---- 1. The portable (self-contained) app ----------------------------------------------
      - name: Publish the unpackaged app
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "publish.log"
          dotnet publish src/AiCeo.Maui/AiCeo.Maui.csproj -c Release -r win-x64 `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }} `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -o ./artifacts/portable 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $tail = ((Get-Content $log -Tail 50) -join " | ") -replace "\r?\n", " "
            Write-Host "::error title=publish-failed::$($tail.Substring(0, [Math]::Min(2500, $tail.Length)))"
            exit 1
          }

      # ---- 2. The setup installer (Inno Setup) ------------------------------------------------
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the setup installer
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) {
            Write-Host "::error title=missing-iscc::Inno Setup's ISCC.exe was not found"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path ./artifacts/out | Out-Null

          $log = Join-Path $env:RUNNER_TEMP "inno.log"
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$(Resolve-Path ./artifacts/portable)" "/DOutputDir=$(Resolve-Path ./artifacts/out)" ./installer/inno-setup/AiCeo.iss 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $tail = ((Get-Content $log -Tail 40) -join " | ") -replace "\r?\n", " "
            Write-Host "::error title=inno-failed::$($tail.Substring(0, [Math]::Min(2500, $tail.Length)))"
            exit 1
          }

      # ---- 3. Best-effort MSIX, plus the portable zip and checksums ---------------------------
      - name: Try to build an MSIX (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet publish src/AiCeo.Maui/AiCeo.Maui.csproj -c Release -r win-x64 `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:WindowsPackageType=MSIX `
            -p:WindowsAppSDKSelfContained=false `
            -p:AppxPackageSigningEnabled=false `
            -p:UapAppxPackageBuildMode=SideloadOnly
          $msix = Get-ChildItem -Path src/AiCeo.Maui -Recurse -Filter *.msix -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msix) {
            Copy-Item $msix.FullName "./artifacts/out/AI-CEO-Orchestrator-${{ steps.version.outputs.version }}-win-x64.msix" -Force
            Write-Host "msix: $($msix.FullName)"
          } else {
            Write-Host "no .msix produced; the setup .exe is the release installer"
          }

      - name: Package the artifacts
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          $zipName = "AI-CEO-Orchestrator-$version-win-x64-portable.zip"
          Compress-Archive -Path "./artifacts/portable/*" -DestinationPath "./artifacts/out/$zipName" -Force
          Write-Host "portable: $zipName"

          $setup = Get-ChildItem ./artifacts/out -Filter "*setup.exe" | Select-Object -First 1
          if (-not $setup) {
            Write-Host "::error title=missing-installer::no setup .exe was produced"
            Get-ChildItem ./artifacts/out | Select-Object Name
            exit 1
          }
          Write-Host "installer: $($setup.Name) ($([Math]::Round($setup.Length / 1MB, 1)) MB)"

          $lines = @()
          Get-ChildItem ./artifacts/out -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath "./artifacts/out/$($_.Name).sha256" -Encoding ascii
            $lines += "$hash  $($_.Name)"
          }
          $lines -join "`n" | Out-File -FilePath "./artifacts/out/SHA256SUMS.txt" -Encoding ascii

          Get-ChildItem ./artifacts/out | Select-Object Name, Length
          "setup=$($setup.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: artifacts/out/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: ./assets

      - name: Verify the release contents
        shell: bash
        run: |
          set -euo pipefail
          ls -la ./assets

          SETUP=$(ls ./assets/*setup.exe 2>/dev/null | head -1 || true)
          ZIP=$(ls ./assets/*.zip 2>/dev/null | head -1 || true)
          SUMS=$(ls ./assets/SHA256SUMS.txt 2>/dev/null | head -1 || true)

          if [ -z "$SETUP" ]; then
            echo "::error title=missing-installer::the release needs the Windows setup .exe"
            exit 1
          fi
          if [ -z "$ZIP" ]; then
            echo "::error title=missing-portable::the release needs the portable zip"
            exit 1
          fi
          if [ -z "$SUMS" ]; then
            echo "::error title=missing-checksums::SHA256SUMS.txt was not uploaded"
            exit 1
          fi

          # The checksum file must describe the installer we are about to publish.
          if ! grep -q "$(basename "$SETUP")" "$SUMS"; then
            echo "::error title=checksum-mismatch::SHA256SUMS.txt does not mention $(basename "$SETUP")"
            exit 1
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: AI CEO Orchestrator ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## AI CEO Orchestrator ${{ github.ref_name }}

            A Windows desktop app (.NET 10 · MAUI Blazor Hybrid) that opens in a native window.

            ### Install
            1. Download `AI-CEO-Orchestrator-*-win-x64-setup.exe`.
            2. Run it. It installs per-user (no administrator rights needed) and adds Start-menu and
               optional desktop shortcuts.
            3. Launch **AI CEO Orchestrator** from the Start menu.
            4. In the sidebar, click **Select Workspace Folder** and choose the folder agents may use.

            Windows SmartScreen may warn because the build is not code-signed — choose
            **More info → Run anyway**. The portable zip needs no installer at all: unzip it and run
            `AiCeo.Maui.exe`.

            ### What's new in v1.0.3
            - **Native desktop app**: no browser, no local web server — the UI runs in a WinUI window.
            - **Local workspace**: pick any folder with the OS folder picker; the path is stored in SQLite.
            - **Tool calling**: workers can `list_files`, `read_file`, `write_file` and `run_command`.
            - **Security guardrail**: every file and command path is validated against the workspace;
              anything outside it is refused (including `..` traversal, absolute paths and symlinks).
            - **Agentic loop**: a tool-enabled worker iterates (write → build → fix) until done, then
              reports back to the CEO, which writes the final answer.

            ### Verify the download
            Each asset has a `.sha256` file, and `SHA256SUMS.txt` covers them all.

            ### Requirements
            Windows 10 1809 (build 17763) or newer, x64.
          files: |
            assets/*.msix
            assets/*.zip
            assets/*.sha256
            assets/SHA256SUMS.txt

name: Release

# v1.0.3 ships as a Windows desktop application (.NET MAUI Blazor Hybrid) in a native window.
# MAUI cannot cross-compile to Windows from Linux/macOS, so the whole desktop build runs on
# windows-latest and produces:
#   * AI-CEO-Orchestrator-<version>-win-x64.msix   (the installer users double-click)
#   * AI-CEO-Orchestrator-<version>-win-x64.zip    (the same app unpackaged, portable)
#   * SHA256 checksums for both
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-desktop:
    name: Build Windows desktop app + MSIX
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install the MAUI workload
        run: dotnet workload install maui-windows --skip-sign-check

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq "v*") { $version = "1.0.3" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "releasing $version"

      - name: Restore
        run: dotnet restore src/AiCeo.Maui/AiCeo.Maui.csproj -r win-x64

      - name: Unit tests
        shell: pwsh
        run: |
          dotnet test tests/AiCeo.Tests/AiCeo.Tests.csproj -c Release --logger "console;verbosity=minimal"

      # ---- 1. The MSIX installer -------------------------------------------------------------
      - name: Build the MSIX installer
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "msix.log"
          dotnet publish src/AiCeo.Maui/AiCeo.Maui.csproj -c Release -r win-x64 `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }} `
            -p:WindowsPackageType=MSIX `
            -p:AppxPackageSigningEnabled=false `
            -p:GenerateAppxPackageOnBuild=true `
            -o ./artifacts/msix 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $errors = (Select-String -Path $log -Pattern "error [A-Z]+[0-9]+|error MSB|error APPX" | Select-Object -First 8 | ForEach-Object { $_.Line.Trim() }) -join " | "
            Write-Host "::error title=msix-failed::$($errors.Substring(0, [Math]::Min(1400, $errors.Length)))"
            exit 1
          }

      # ---- 2. The portable unpackaged build ---------------------------------------------------
      - name: Build the portable app
        shell: pwsh
        run: |
          dotnet publish src/AiCeo.Maui/AiCeo.Maui.csproj -c Release -r win-x64 `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -o ./artifacts/portable

      - name: Package the artifacts
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path ./artifacts/out | Out-Null

          $msix = Get-ChildItem -Path ./artifacts/msix -Recurse -Filter *.msix -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $msix) {
            $msix = Get-ChildItem -Path src/AiCeo.Maui -Recurse -Filter *.msix -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          }
          if (-not $msix) {
            Write-Host "::error title=missing-msix::no .msix was produced by the MAUI build"
            Get-ChildItem -Path ./artifacts -Recurse | Select-Object FullName
            exit 1
          }

          $msixName = "AI-CEO-Orchestrator-$version-win-x64.msix"
          Copy-Item $msix.FullName "./artifacts/out/$msixName" -Force
          Write-Host "installer: $msixName ($([Math]::Round($msix.Length / 1MB, 1)) MB)"

          $exe = Get-ChildItem -Path ./artifacts/portable -Filter "AiCeo.Maui.exe" -Recurse -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error title=missing-exe::the portable build produced no AiCeo.Maui.exe"
            Get-ChildItem -Path ./artifacts/portable | Select-Object Name
            exit 1
          }

          $zipName = "AI-CEO-Orchestrator-$version-win-x64-portable.zip"
          Compress-Archive -Path "./artifacts/portable/*" -DestinationPath "./artifacts/out/$zipName" -Force
          Write-Host "portable: $zipName"

          # Checksums
          $lines = @()
          Get-ChildItem ./artifacts/out -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath "./artifacts/out/$($_.Name).sha256" -Encoding ascii
            $lines += "$hash  $($_.Name)"
          }
          $lines -join "`n" | Out-File -FilePath "./artifacts/out/SHA256SUMS.txt" -Encoding ascii

          Get-ChildItem ./artifacts/out | Select-Object Name, Length
          "msix=$msixName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: artifacts/out/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: ./assets

      - name: Verify the release contents
        shell: bash
        run: |
          set -euo pipefail
          ls -la ./assets

          MSIX=$(ls ./assets/*.msix 2>/dev/null | head -1 || true)
          ZIP=$(ls ./assets/*.zip 2>/dev/null | head -1 || true)
          SUMS=$(ls ./assets/SHA256SUMS.txt 2>/dev/null | head -1 || true)

          if [ -z "$MSIX" ]; then
            echo "::error title=missing-msix::the release needs a Windows .msix installer"
            exit 1
          fi
          if [ -z "$ZIP" ]; then
            echo "::error title=missing-portable::the release needs the portable zip"
            exit 1
          fi
          if [ -z "$SUMS" ]; then
            echo "::error title=missing-checksums::SHA256SUMS.txt was not uploaded"
            exit 1
          fi

          # The checksum file must describe the installer we are about to publish.
          if ! grep -q "$(basename "$MSIX")" "$SUMS"; then
            echo "::error title=checksum-mismatch::SHA256SUMS.txt does not mention $(basename "$MSIX")"
            exit 1
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: AI CEO Orchestrator ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## AI CEO Orchestrator ${{ github.ref_name }}

            A Windows desktop app (.NET 10 · MAUI Blazor Hybrid) that opens in a native window.

            ### Install
            1. Download `AI-CEO-Orchestrator-*-win-x64.msix`.
            2. Double-click it and choose **Install**. Windows may warn about an unsigned package
               (this build is not code-signed) — choose **More info → Install anyway**, or use the
               portable zip instead.
            3. Launch **AI CEO Orchestrator** from the Start menu.
            4. In the sidebar, click **Select Workspace Folder** and choose the folder agents may use.

            The portable zip needs no installer: unzip it and run `AiCeo.Maui.exe`.

            ### What's new in v1.0.3
            - **Native desktop app**: no browser, no local web server — the UI runs in a WinUI window.
            - **Local workspace**: pick any folder with the OS folder picker; the path is stored in SQLite.
            - **Tool calling**: workers can `list_files`, `read_file`, `write_file` and `run_command`.
            - **Security guardrail**: every file and command path is validated against the workspace;
              anything outside it is refused (including `..` traversal, absolute paths and symlinks).
            - **Agentic loop**: a tool-enabled worker iterates (write → build → fix) until done, then
              reports back to the CEO, which writes the final answer.

            ### Verify the download
            Each asset has a `.sha256` file, and `SHA256SUMS.txt` covers them all.

            ### Requirements
            Windows 10 1809 (build 17763) or newer, x64.
          files: |
            assets/*.msix
            assets/*.zip
            assets/*.sha256
            assets/SHA256SUMS.txt

name: Release

# v2.0.1+ ships a portable build *and* a native installer for every platform, and every file name
# carries the version, so two releases can never be confused once they are downloaded:
#   * Windows  win-x64 / win-x86 / win-arm64 → AiCeo-win-<arch>-v<version>.exe    (portable)
#                                            → Setup-win-<arch>-v<version>.exe    (Inno Setup)
#   * Linux    linux-x64 / linux-arm64       → AiCeo-linux-<arch>-v<version>.tar.gz (portable)
#                                            → AiCeo-linux-<arch>-v<version>.deb    (dpkg-deb)
#   * macOS    osx-x64 / osx-arm64           → AiCeo-osx-<arch>-v<version>.tar.gz (portable)
#                                            → AiCeo-osx-<arch>-v<version>.dmg      (hdiutil, .app)
# No .zip and no .msix.
#
# PRODUCT_VERSION below is the single source of truth for those names. The release job fails the
# build when it disagrees with <Version> in AiCeo.Desktop.csproj, installer.iss or the Nexus badge,
# so a name can never advertise a version the binaries do not carry.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  # The version that appears in every asset name ("AiCeo-win-x64-v2.0.2.exe").
  PRODUCT_VERSION: "2.0.3"

jobs:
  # ------------------------------------------------------------------ portable binaries
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The asset name is computed from PRODUCT_VERSION in the first step, so the version is
        # written down once instead of seven times.
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-x86
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Name the release asset
        id: name
        shell: bash
        run: |
          set -euo pipefail
          RID="${{ matrix.rid }}"
          case "$RID" in
            win-*)   EXT=".exe" ;;
            *)       EXT=".tar.gz" ;;
          esac
          ASSET="AiCeo-$RID-v$PRODUCT_VERSION$EXT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "release asset: $ASSET"

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish ${{ matrix.rid }} (single file, self-contained)
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet publish src/AiCeo.Desktop/AiCeo.Desktop.csproj \
                -c Release -r ${{ matrix.rid }} \
                --self-contained true \
                -p:PublishSingleFile=true \
                -p:IncludeNativeLibrariesForSelfExtract=true \
                -p:DebugType=none \
                -p:DebugSymbols=false \
                2>&1 | tee "$RUNNER_TEMP/publish.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|error MSB|error NU" "$RUNNER_TEMP/publish.log" | head -8 | tr '\n' '|')
            echo "::error title=publish-failed::${MSG:0:1800}"
            tail -40 "$RUNNER_TEMP/publish.log"
            exit 1
          fi

      - name: Locate the single-file executable
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="src/AiCeo.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish"

          if [ "${{ matrix.rid }}" = "win-x64" ] || [ "${{ matrix.rid }}" = "win-x86" ] || [ "${{ matrix.rid }}" = "win-arm64" ]; then
            EXE="$ROOT/AiCeo.exe"
          else
            EXE="$ROOT/AiCeo"
          fi

          if [ ! -f "$EXE" ]; then
            echo "publish output:"
            ls -la "$ROOT" || true
            echo "::error title=missing-binary::no executable at $EXE"
            exit 1
          fi

          echo "binary: $EXE ($(du -h "$EXE" | cut -f1))"
          echo "path=$EXE" >> "$GITHUB_OUTPUT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Smoke test the executable (--self-test)
        shell: bash
        run: |
          set +e
          EXE="${{ steps.locate.outputs.path }}"
          ROOT="${{ steps.locate.outputs.root }}"
          export AICEO_DB_PATH="$RUNNER_TEMP/smoke/aiceo.db"
          mkdir -p "$RUNNER_TEMP/smoke"

          if [ "${{ matrix.rid }}" = "win-x86" ]; then
            echo "cross-architecture binary (${{ matrix.rid }}): execution skipped on an x64 runner"
            exit 0
          fi

          if [ "${{ matrix.rid }}" = "win-arm64" ] || [ "${{ matrix.rid }}" = "linux-arm64" ] || [ "${{ matrix.rid }}" = "osx-x64" ]; then
            echo "cross-architecture binary (${{ matrix.rid }}): execution skipped on this runner"
            exit 0
          fi

          "$EXE" --self-test 2>&1 | tee "$RUNNER_TEMP/selftest.log"
          CODE=${PIPESTATUS[0]}
          echo "self-test exit code: $CODE"

          if [ "$CODE" -ne 0 ]; then
            echo "::error title=selftest-failed::the published binary did not pass --self-test"
            exit 1
          fi

          if ! grep -q "SELF-TEST OK" "$RUNNER_TEMP/selftest.log"; then
            if [ -f "$ROOT/self-test.log" ] && grep -q "SELF-TEST OK" "$ROOT/self-test.log"; then
              echo "self-test reported OK via self-test.log"
            else
              echo "::error title=selftest-report::SELF-TEST OK was not reported"
              exit 1
            fi
          fi

      - name: Assemble the release asset (Windows .exe)
        if: startsWith(matrix.rid, 'win-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${{ steps.locate.outputs.path }}" "dist/${{ steps.name.outputs.asset }}"
          ls -la dist

      - name: Assemble the release asset (.tar.gz)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist stage
          cp "${{ steps.locate.outputs.path }}" stage/AiCeo
          chmod +x stage/AiCeo
          cp README.md stage/README.md
          tar -czf "dist/${{ steps.name.outputs.asset }}" -C stage .
          rm -rf stage
          ls -la dist

      - name: Upload the portable asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.asset }}
          path: dist/${{ steps.name.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ Windows installers
  windows-installer:
    name: Windows installer (Inno Setup, ${{ matrix.arch }})
    needs: publish
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the portable ${{ matrix.arch }} executable
        uses: actions/download-artifact@v4
        with:
          name: AiCeo-win-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.exe
          path: dist

      # v1.0.15: the installer embeds the Evergreen WebView2 bootstrapper and runs it silently
      # when the runtime is missing (the usual reason an installed build looks dead). A CDN hiccup
      # must not fail the release — installer.iss degrades to a download link when the file is absent.
      - name: Fetch the WebView2 Evergreen bootstrapper
        continue-on-error: true
        shell: pwsh
        run: |
          $target = Join-Path "dist" "MicrosoftEdgeWebView2Setup.exe"
          foreach ($attempt in 1..3) {
            try {
              Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $target -UseBasicParsing -TimeoutSec 120
              if ((Get-Item $target).Length -gt 1MB) {
                Write-Host "WebView2 bootstrapper: $((Get-Item $target).Length) bytes"
                exit 0
              }
            } catch {
              Write-Host "attempt $attempt failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 5
            }
          }
          Write-Host "::warning title=webview2-bootstrapper::could not download the WebView2 bootstrapper; the installer will link to the download page instead"

      - name: Install Inno Setup via Chocolatey
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1).FullName
          }
          if (-not $iscc) {
            Write-Host "::error title=no-inno-setup::ISCC.exe was not installed by Chocolatey"
            exit 1
          }
          Write-Host "ISCC: $iscc"
          # Print the compiler version: ARM64 installers need Inno Setup 6.3 or newer. The help
          # output returns a non-zero exit code, which must not fail the step.
          & $iscc /? 2>&1 | Select-Object -First 3 | Write-Host
          $LASTEXITCODE = 0
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compile Setup-win-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.exe
        shell: pwsh
        run: |
          $version = (Select-String -Path "src/AiCeo.Desktop/AiCeo.Desktop.csproj" -Pattern "<Version>([^<]+)</Version>").Matches[0].Groups[1].Value
          $arch = "${{ matrix.arch }}"
          if ($version -ne "${{ env.PRODUCT_VERSION }}") {
            Write-Host "::error title=version-drift::csproj says $version but release.yml names assets ${{ env.PRODUCT_VERSION }}"
            exit 1
          }
          $source = "dist\AiCeo-win-$arch-v$version.exe"
          Write-Host "building Setup-win-$arch-v$version.exe from $source"

          Get-ChildItem "dist" | Select-Object Name, Length

          if (-not (Test-Path $source)) {
            Write-Host "::error title=missing-portable::$source was not downloaded"
            exit 1
          }

          $log = Join-Path $env:RUNNER_TEMP "iscc-$arch.log"
          & $env:ISCC "/DAppVersion=$version" "/DAppArch=$arch" "/DAppSourceExe=$source" "installer.iss" 2>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $errors = (Select-String -Path $log -Pattern "Error|error" | Select-Object -First 6 |
              ForEach-Object { $_.Line.Trim() }) -join " | "
            Write-Host "::error title=iscc-failed::$($errors.Substring(0, [Math]::Min(1800, $errors.Length)))"
            exit 1
          }

      - name: Verify the installer
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          $expected = "Setup-win-$arch-v${{ env.PRODUCT_VERSION }}.exe"
          $setup = Join-Path "dist/installer" $expected

          Get-ChildItem "dist/installer" -ErrorAction SilentlyContinue | Select-Object Name, Length

          if (-not (Test-Path $setup)) {
            Write-Host "::error title=missing-installer::$expected was not produced"
            exit 1
          }

          $header = [System.IO.File]::ReadAllBytes($setup)[0..1]
          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
            Write-Host "::error title=bad-installer::the installer is not a Windows executable"
            exit 1
          }

          $sizeMb = [Math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "installer: $expected ($sizeMb MB)"
          if ((Get-Item $setup).Length -lt 5MB) {
            Write-Host "::error title=small-installer::the installer does not contain the application"
            exit 1
          }

      - name: Upload Setup-win-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.exe
        uses: actions/upload-artifact@v4
        with:
          name: Setup-win-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.exe
          path: dist/installer/Setup-win-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.exe
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ Linux .deb packages
  linux-packages:
    name: Linux package (.deb, ${{ matrix.arch }})
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb_arch: amd64
          - arch: arm64
            deb_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the portable archive
        uses: actions/download-artifact@v4
        with:
          name: AiCeo-linux-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.tar.gz
          path: dist

      - name: Assemble the Debian package
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/AiCeo.Desktop/AiCeo.Desktop.csproj | head -1)
          ARCH="${{ matrix.arch }}"
          DEB_ARCH="${{ matrix.deb_arch }}"
          ROOT="$RUNNER_TEMP/pkgroot"

          echo "packaging AiCeo-linux-$ARCH-v$VERSION.deb (version $VERSION, architecture $DEB_ARCH)"

          rm -rf "$ROOT"
          mkdir -p "$ROOT/DEBIAN" \
                   "$ROOT/usr/lib/aiceo" \
                   "$ROOT/usr/bin" \
                   "$ROOT/usr/share/applications" \
                   "$ROOT/usr/share/icons/hicolor/256x256/apps" \
                   "$ROOT/usr/share/doc/aiceo"

          tar -xzf "dist/AiCeo-linux-$ARCH-v$VERSION.tar.gz" -C "$ROOT/usr/lib/aiceo"
          rm -f "$ROOT/usr/lib/aiceo/README.md"
          chmod 755 "$ROOT/usr/lib/aiceo/AiCeo"
          ln -s /usr/lib/aiceo/AiCeo "$ROOT/usr/bin/aiceo"

          cp src/AiCeo.Desktop/Assets/aiceo.png "$ROOT/usr/share/icons/hicolor/256x256/apps/aiceo.png"
          cp README.md "$ROOT/usr/share/doc/aiceo/README.md"

          cat > "$ROOT/usr/share/applications/aiceo.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=AI CEO Orchestrator
          GenericName=AI Orchestrator
          Comment=Star-topology AI orchestrator with a sandboxed workspace
          Exec=aiceo
          Icon=aiceo
          Terminal=false
          Categories=Development;Utility;
          StartupWMClass=AiCeo
          DESKTOP

          INSTALLED_KB=$(du -sk "$ROOT/usr" | cut -f1)

          cat > "$ROOT/DEBIAN/control" <<CONTROL
          Package: aiceo
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: $DEB_ARCH
          Installed-Size: $INSTALLED_KB
          Maintainer: Sagar Singh <sagar@users.noreply.github.com>
          Homepage: https://github.com/Sagar-79-Singh/ai-ceo
          Depends: libx11-6, libfontconfig1, libgtk-3-0, libwebkit2gtk-4.1-0, libnotify4
          Recommends: fonts-dejavu-core
          Description: AI CEO Orchestrator
           A cross-platform desktop AI orchestrator written in C# / .NET 10.
           You brief one CEO agent, which plans the work, delegates to a single
           worker at a time inside the folder you choose, and reports back.
           .
           The interface is the Nexus HTML/WebGL console rendered by the
           system WebView (WebKitGTK 4.1) inside a native window provided by
           PhotinoX.
          CONTROL

          cat > "$ROOT/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q /usr/share/icons/hicolor || true
          fi
          exit 0
          POSTINST
          chmod 755 "$ROOT/DEBIAN/postinst"

          dpkg-deb --root-owner-group --build "$ROOT" "dist/AiCeo-linux-$ARCH-v$VERSION.deb"

      - name: Verify the package
        shell: bash
        run: |
          set -euo pipefail
          DEB="dist/AiCeo-linux-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.deb"

          if [ ! -f "$DEB" ]; then
            echo "::error title=missing-deb::$DEB was not produced"
            exit 1
          fi

          if [ "$(head -c 7 "$DEB")" != "!<arch>" ]; then
            echo "::error title=bad-deb::$(basename "$DEB") is not a Debian archive"
            exit 1
          fi

          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | head -20

          SIZE=$(stat -c%s "$DEB")
          echo "package size: $SIZE bytes"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error title=small-deb::the package does not contain the application"
            exit 1
          fi

      - name: Upload AiCeo-linux-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.deb
        uses: actions/upload-artifact@v4
        with:
          name: AiCeo-linux-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.deb
          path: dist/AiCeo-linux-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.deb
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ macOS .dmg images
  macos-dmg:
    name: macOS installer (.dmg, ${{ matrix.arch }})
    needs: publish
    runs-on: macos-latest
    env:
      # v1.0.15: the oldest macOS this image supports (High Sierra). Declared once, used by the
      # bundle's Info.plist and by the two checks in the packaging script.
      MIN_MACOS: "10.13"
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # v1.0.16: `hdiutil create` kept failing with "No space left on device" on the hosted macOS
      # images — they ship every Xcode release and the simulator runtimes, which leaves too little
      # scratch for the compressed image. A .NET desktop build needs none of it: hdiutil, sips,
      # iconutil and codesign all live in /usr/bin. The cleanup is reported as an annotation (job
      # logs are not readable from every environment) and the job fails fast if it is still tight.
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "before: $(df -h / | tail -1)"

          sudo rm -rf /Applications/Xcode*.app
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          sudo rm -rf /Library/Developer/CoreSimulator/Caches
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches
          sudo rm -rf ~/Library/Caches/Homebrew ~/Library/Caches/pip
          sudo rm -rf "$RUNNER_TEMP"/*

          FREE_MB=$(df -m / | awk 'NR==2{print $4}')
          echo "after: $(df -h / | tail -1)"
          echo "::notice title=disk-space::${FREE_MB} MB free after cleanup"

          if [ "$FREE_MB" -lt 3072 ]; then
            echo "::error title=low-disk::only ${FREE_MB} MB free; hdiutil needs at least 3 GB of scratch"
            exit 1
          fi

      - name: Download the portable archive
        uses: actions/download-artifact@v4
        with:
          name: AiCeo-osx-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.tar.gz
          path: dist

      - name: Assemble the .app bundle
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/AiCeo.Desktop/AiCeo.Desktop.csproj | head -1)
          ARCH="${{ matrix.arch }}"
          APP="$RUNNER_TEMP/AI CEO Orchestrator.app"

          # v1.0.15: this image targets macOS 10.13 (High Sierra) or later. The version declared
          # in Info.plist below is the floor LaunchServices enforces; this check makes sure the
          # image is never built on — or labelled for — anything older.
          version_ge() {   # version_ge <have> <need> -> true when have >= need
            local IFS=.
            local -a have=($1) need=($2)
            local i x y
            for i in 0 1 2; do
              x=${have[i]:-0}; y=${need[i]:-0}
              if [ "$x" -gt "$y" ]; then return 0; fi
              if [ "$x" -lt "$y" ]; then return 1; fi
            done
            return 0
          }

          HOST_MACOS="$(sw_vers -productVersion)"
          if ! version_ge "$HOST_MACOS" "$MIN_MACOS"; then
            echo "::error title=unsupported-macos::macOS $HOST_MACOS cannot build or run this image; macOS $MIN_MACOS or later is required"
            exit 1
          fi
          echo "macOS floor $MIN_MACOS satisfied by the build host ($HOST_MACOS)"

          echo "packaging AiCeo-osx-$ARCH-v$VERSION.dmg (version $VERSION)"

          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          tar -xzf "dist/AiCeo-osx-$ARCH-v$VERSION.tar.gz" -C "$APP/Contents/MacOS"
          # The archive has been unpacked; keeping it costs ~90 MB of the very scratch space the
          # compressed image needs.
          rm -f "dist/AiCeo-osx-$ARCH-v$VERSION.tar.gz"
          if [ -f "$APP/Contents/MacOS/README.md" ]; then
            mv "$APP/Contents/MacOS/README.md" "$APP/Contents/Resources/README.md"
          fi
          chmod +x "$APP/Contents/MacOS/AiCeo"

          # Icon: the shipped 256×256 PNG turned into a real .icns.
          ICONSET="$RUNNER_TEMP/AiCeo.iconset"
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" src/AiCeo.Desktop/Assets/aiceo.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            sips -z "$((size * 2))" "$((size * 2))" src/AiCeo.Desktop/Assets/aiceo.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AiCeo.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>AI CEO Orchestrator</string>
            <key>CFBundleDisplayName</key>
            <string>AI CEO Orchestrator</string>
            <key>CFBundleIdentifier</key>
            <string>com.sagarsingh.aiceo</string>
            <key>CFBundleVersion</key>
            <string>$VERSION</string>
            <key>CFBundleShortVersionString</key>
            <string>$VERSION</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>AiCeo</string>
            <key>CFBundleIconFile</key>
            <string>AiCeo</string>
            <key>CFBundleSignature</key>
            <string>????</string>
            <key>LSMinimumSystemVersion</key>
            <string>$MIN_MACOS</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSRequiresAquaSystemAppearance</key>
            <false/>
          </dict>
          </plist>
          PLIST

          # Ad-hoc signature: the bundle is unsigned, but a valid local signature keeps
          # macOS from refusing to launch the inner executable outright.
          codesign --force --deep --sign - "$APP" || echo "::warning::ad-hoc signing was skipped"

      - name: Build the .dmg
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/AiCeo.Desktop/AiCeo.Desktop.csproj | head -1)
          ARCH="${{ matrix.arch }}"
          APP="$RUNNER_TEMP/AI CEO Orchestrator.app"
          STAGE="$RUNNER_TEMP/dmg-stage"

          # The image must announce — and refuse to violate — the macOS 10.13 floor. Anything
          # lower is rejected here rather than reaching a user's Mac.
          PLIST_MIN=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")
          if [ "$PLIST_MIN" != "$MIN_MACOS" ]; then
            echo "::error title=wrong-macos-floor::Info.plist declares '$PLIST_MIN' but this image targets macOS $MIN_MACOS"
            exit 1
          fi
          echo "Info.plist LSMinimumSystemVersion = $PLIST_MIN"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          # v1.0.16: `hdiutil create -srcfolder` sizes its scratch image from an internal estimate
          # and failed twice with "could not access .../Contents/MacOS/AiCeo - No space left on
          # device" on hosted runners that had hundreds of gigabytes free (the diagnostic job
          # reports the same runners with 163 GB available). The image is now sized explicitly from
          # the payload — twice its size plus 512 MB of slack — mounted, filled with ditto and then
          # converted to UDZO: the two-step recipe Apple documents, with no size heuristic left to
          # guess wrong. Every step is echoed so the next failure is diagnosable from annotations.
          PAYLOAD_MB=$(du -sm "$APP" | cut -f1)
          echo "payload: ${PAYLOAD_MB} MB in $(find "$APP" | wc -l | tr -d ' ') entries"
          if [ "$PAYLOAD_MB" -gt 1024 ]; then
            echo "::error title=oversized-bundle::the .app is ${PAYLOAD_MB} MB; a single-file build should be far smaller"
            exit 1
          fi
          IMAGE_MB=$(( PAYLOAD_MB * 2 + 512 ))
          RW="$RUNNER_TEMP/AiCeo-$ARCH-rw.dmg"
          MNT="$RUNNER_TEMP/AiCeo-$ARCH-mnt"
          VOLNAME="AI CEO Orchestrator $VERSION"
          DMG="dist/AiCeo-osx-$ARCH-v$VERSION.dmg"

          build_image() {
            rm -f "$RW"
            # No -format here: hdiutil only accepts -format together with -srcfolder/-srcdevice.
            # A blank image created from -size is read/write (UDRW) by default, which is what the
            # attach/ditto/convert sequence needs.
            hdiutil create -size "${IMAGE_MB}m" -fs HFS+ -volname "$VOLNAME" -ov "$RW"
            mkdir -p "$MNT"
            hdiutil attach "$RW" -nobrowse -noverify -mountpoint "$MNT"
            ditto "$STAGE/" "$MNT/"
            if [ ! -f "$MNT/AI CEO Orchestrator.app/Contents/MacOS/AiCeo" ]; then
              echo "::error title=empty-image::the staged .app is missing from the mounted image"
              return 1
            fi
            sync
            hdiutil detach "$MNT" -force
            rm -f "$DMG"
            hdiutil convert "$RW" -format UDZO -imagekey zlib-level=9 -o "$DMG"
          }

          # A shared runner can still report "Resource busy" while a previous device detaches; three
          # attempts with a short pause keep the job deterministic. Each attempt is captured so a
          # real failure reaches an annotation.
          for attempt in 1 2 3; do
            echo "--- attempt $attempt: ${IMAGE_MB} MB image, $(df -m / | awk 'NR==2{print $4}') MB free"
            hdiutil detach "$MNT" -force >/dev/null 2>&1 || true
            if build_image 2>&1 | tee "$RUNNER_TEMP/hdiutil-$attempt.log"; then
              echo "hdiutil succeeded on attempt $attempt"
              break
            fi

            echo "::warning title=hdiutil-retry::attempt $attempt failed"
            hdiutil detach "$MNT" -force >/dev/null 2>&1 || true
            hdiutil detach "$VOLNAME" -force >/dev/null 2>&1 || true
            sleep 5

            if [ "$attempt" = "3" ]; then
              echo "disk space at failure: $(df -h / | tail -1)"
              DETAIL=$(tail -c 2000 "$RUNNER_TEMP/hdiutil-$attempt.log" | tr '\n' '|' | tr -d '\r')
              echo "::error title=dmg-failed::${DETAIL:0:3000}"
              exit 1
            fi
          done

          rm -rf "$MNT" "$RW" "$STAGE"

          if [ ! -f "$DMG" ]; then
            echo "::error title=dmg-missing::hdiutil reported success but produced no image"
            exit 1
          fi

          echo "image: $(du -h "$DMG" | cut -f1) ($(stat -f%z "$DMG") bytes)"

      - name: Verify the image
        shell: bash
        run: |
          set -euo pipefail
          DMG="dist/AiCeo-osx-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.dmg"

          if [ ! -f "$DMG" ]; then
            echo "::error title=missing-dmg::$DMG was not produced"
            exit 1
          fi

          if [ "$(tail -c 512 "$DMG" | head -c 4)" != "koly" ]; then
            echo "::error title=bad-dmg::$(basename "$DMG") has no UDIF trailer"
            exit 1
          fi

          hdiutil verify "$DMG"

          SIZE=$(stat -f%z "$DMG")
          echo "image size: $SIZE bytes"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error title=small-dmg::the image does not contain the application"
            exit 1
          fi

      - name: Upload AiCeo-osx-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.dmg
        uses: actions/upload-artifact@v4
        with:
          name: AiCeo-osx-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.dmg
          path: dist/AiCeo-osx-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.dmg
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ release
  release:
    name: Create GitHub Release
    needs: [publish, windows-installer, linux-packages, macos-dmg]
    runs-on: ubuntu-latest

    steps:
      # Full history: the final step pushes a bookkeeping commit back to main, and git refuses to
      # push from a shallow clone.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download every asset
        uses: actions/download-artifact@v4
        with:
          path: ./assets
          merge-multiple: true

      - name: Verify the release contents
        shell: bash
        run: |
          set -euo pipefail
          ls -la ./assets

          # v1.0.16: the version in every file name must be the version the binaries carry.
          # PRODUCT_VERSION (release.yml), <Version> (csproj), AppVersion (installer.iss) and the
          # Nexus badge are four places that describe one number; this is where they are checked.
          CSPROJ_VERSION=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/AiCeo.Desktop/AiCeo.Desktop.csproj | head -1)
          ISS_VERSION=$(sed -n 's:.*#define AppVersion "\([^"]*\)".*:\1:p' installer.iss | head -1)
          BADGE_VERSION=$(sed -n 's:.*<span id="nx-version"[^>]*>\([^<]*\)</span>.*:\1:p' src/AiCeo.Desktop/Assets/nexus.html | head -1)

          echo "version: release.yml=$PRODUCT_VERSION csproj=$CSPROJ_VERSION installer.iss=$ISS_VERSION nexus=$BADGE_VERSION"

          for pair in "csproj=$CSPROJ_VERSION" "installer.iss=$ISS_VERSION" "nexus badge=$BADGE_VERSION"; do
            if [ "${pair#*=}" != "$PRODUCT_VERSION" ] && [ "${pair#*=}" != "v$PRODUCT_VERSION" ]; then
              echo "::error title=version-drift::${pair%%=*} says ${pair#*=} but the assets are named v$PRODUCT_VERSION"
              exit 1
            fi
          done

          # 14 deliverables: a portable build and an installer for every platform/architecture,
          # each carrying the release version in its name.
          for asset in \
            AiCeo-win-x64-v$PRODUCT_VERSION.exe \
            AiCeo-win-x86-v$PRODUCT_VERSION.exe \
            AiCeo-win-arm64-v$PRODUCT_VERSION.exe \
            Setup-win-x64-v$PRODUCT_VERSION.exe \
            Setup-win-x86-v$PRODUCT_VERSION.exe \
            Setup-win-arm64-v$PRODUCT_VERSION.exe \
            AiCeo-linux-x64-v$PRODUCT_VERSION.tar.gz \
            AiCeo-linux-arm64-v$PRODUCT_VERSION.tar.gz \
            AiCeo-linux-x64-v$PRODUCT_VERSION.deb \
            AiCeo-linux-arm64-v$PRODUCT_VERSION.deb \
            AiCeo-osx-x64-v$PRODUCT_VERSION.tar.gz \
            AiCeo-osx-arm64-v$PRODUCT_VERSION.tar.gz \
            AiCeo-osx-x64-v$PRODUCT_VERSION.dmg \
            AiCeo-osx-arm64-v$PRODUCT_VERSION.dmg
          do
            if [ ! -f "./assets/$asset" ]; then
              echo "::error title=missing-asset::$asset was not produced"
              exit 1
            fi
            if [ ! -s "./assets/$asset" ]; then
              echo "::error title=empty-asset::$asset is empty"
              exit 1
            fi
          done

          # Windows binaries — portable and installers — must be real PE files.
          for exe in ./assets/AiCeo-win-*.exe ./assets/Setup-win-*.exe; do
            if [ "$(head -c 2 "$exe")" != "MZ" ]; then
              echo "::error title=bad-exe::$(basename "$exe") is not a Windows executable"
              exit 1
            fi
          done

          # The portable archives must be gzip tarballs.
          for archive in ./assets/AiCeo-*.tar.gz; do
            if ! tar -tzf "$archive" > /dev/null; then
              echo "::error title=bad-archive::$(basename "$archive") is not a valid .tar.gz"
              exit 1
            fi
          done

          # Debian packages are `ar` archives; disk images end in a UDIF trailer.
          for deb in ./assets/AiCeo-*.deb; do
            if [ "$(head -c 7 "$deb")" != "!<arch>" ]; then
              echo "::error title=bad-deb::$(basename "$deb") is not a Debian package"
              exit 1
            fi
          done

          for dmg in ./assets/AiCeo-*.dmg; do
            if [ "$(tail -c 512 "$dmg" | head -c 4)" != "koly" ]; then
              echo "::error title=bad-dmg::$(basename "$dmg") is not a UDIF image"
              exit 1
            fi
          done

          # Checksums for every asset.
          cd ./assets
          : > SHA256SUMS.txt
          for file in $(ls | grep -v -E '^SHA256SUMS\.txt$|\.sha256$' | sort); do
            sha256sum "$file" > "$file.sha256"
            cat "$file.sha256" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: AI CEO Orchestrator v${{ env.PRODUCT_VERSION }}
          tag_name: v${{ env.PRODUCT_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          # v2.0.3: the notes are written by hand below and are short and user-facing — what
          # changed, then the download table. GitHub's generated changelog (every commit subject
          # since the last tag) stays off, and nothing from the developer tooling appears here.
          generate_release_notes: false
          body: |
            ## AI CEO Orchestrator v${{ env.PRODUCT_VERSION }}

            A cross-platform desktop AI orchestrator (.NET 10 · PhotinoX + native WebView) where a CEO agent
            plans, delegates to one specialist at a time, and answers you — inside a folder you choose, with
            every file write and command still waiting for your **Approve** or **Reject**.

            ### What's New in v2.0.3

            **One conversation, two voices.** The main chat is now only you and the CEO. Delegations, worker
            results, tool calls and command output no longer flood the transcript — those lines belong to the
            worker that produced them. When the CEO hands work to an agent it says so in one sentence, for
            example *"I have asked Forge to write the Python script. I will let you know when it is done."*, and
            the full CEO ↔ worker conversation stays one click away in the sidebar.

            **Approvals block the window.** A pending write or command used to appear as a card inside the
            transcript, where it was easy to scroll past while the run sat there waiting. It is now a
            full-screen, centered modal that opens by itself, dims everything behind it and cannot be missed.
            It shows the tool, the exact command or file path, the diff or command line, and the **Approve** /
            **Reject** buttons — with a reason box that is sent back to the CEO when you reject.

            Everything from v2.0.2 is still here: one chat view at a time with **← Back to CEO**, opaque bubbles,
            fixed-height transcripts, no repainting of hidden chats, plus the v2.0.1 WhatsApp-style surface, live
            agent chats and sign-in with GitHub Copilot or ChatGPT (Codex) instead of a pasted key.

            ### Downloads

            | Platform | Portable | Installer |
            | --- | --- | --- |
            | Windows x64 (recommended) | `AiCeo-win-x64-v${{ env.PRODUCT_VERSION }}.exe` | `Setup-win-x64-v${{ env.PRODUCT_VERSION }}.exe` |
            | Windows x86 (32-bit) | `AiCeo-win-x86-v${{ env.PRODUCT_VERSION }}.exe` | `Setup-win-x86-v${{ env.PRODUCT_VERSION }}.exe` |
            | Windows ARM64 | `AiCeo-win-arm64-v${{ env.PRODUCT_VERSION }}.exe` | `Setup-win-arm64-v${{ env.PRODUCT_VERSION }}.exe` |
            | Linux x64 | `AiCeo-linux-x64-v${{ env.PRODUCT_VERSION }}.tar.gz` | `AiCeo-linux-x64-v${{ env.PRODUCT_VERSION }}.deb` |
            | Linux ARM64 | `AiCeo-linux-arm64-v${{ env.PRODUCT_VERSION }}.tar.gz` | `AiCeo-linux-arm64-v${{ env.PRODUCT_VERSION }}.deb` |
            | macOS Intel | `AiCeo-osx-x64-v${{ env.PRODUCT_VERSION }}.tar.gz` | `AiCeo-osx-x64-v${{ env.PRODUCT_VERSION }}.dmg` |
            | macOS Apple Silicon | `AiCeo-osx-arm64-v${{ env.PRODUCT_VERSION }}.tar.gz` | `AiCeo-osx-arm64-v${{ env.PRODUCT_VERSION }}.dmg` |

            Portable: run the file (Linux/macOS: `tar -xzf … && ./AiCeo`). Debian/Ubuntu:
            `sudo apt install ./AiCeo-linux-x64-v${{ env.PRODUCT_VERSION }}.deb`. macOS: open the
            `.dmg` and drag the app to Applications. Every executable is single-file and
            self-contained — .NET is inside it, nothing needs installing first.

            ### Windows SmartScreen

            The builds are **not code-signed**, so SmartScreen will show *"Windows protected your PC"*
            the first time you run the portable `.exe` or `Setup-…exe`. Click **More info → Run anyway**,
            or verify the download against `SHA256SUMS.txt` first. On macOS, if Gatekeeper blocks the
            ad-hoc signed app, right-click → **Open** once.

          files: |
            assets/*.exe
            assets/*.tar.gz
            assets/*.deb
            assets/*.dmg
            assets/*.sha256
            assets/SHA256SUMS.txt

      # Record the release with the attribution this release was built with.
      #
      # The commit is made by the GitHub Actions bot as an empty commit on main, carrying the
      # trailer of the release commit:
      #
      #     Co-Authored-By: Codex <noreply@openai.com>
      #
      # `[skip ci]` keeps this bookkeeping commit from launching another CI run; the tag-triggered
      # release workflow is unaffected by pushes to main. It runs last and is allowed to fail:
      # attribution must never be able to stop a release that has already been published.
      - name: Commit the release with its attribution trailer
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/AiCeo.Desktop/AiCeo.Desktop.csproj | head -1)"
          if [ -z "$version" ]; then
            echo "::warning title=no-version::could not read the version; skipping the attribution commit"
            exit 0
          fi

          git fetch --no-tags origin main
          git checkout -B main origin/main

          git commit --allow-empty \
            -m "chore(release): v$version [skip ci]" \
            -m "Release v$version published by the Release workflow (run ${{ github.run_id }})." \
            -m "Co-Authored-By: Codex <noreply@openai.com>"

          git log -1 --pretty=%B

          if ! git push origin HEAD:main; then
            echo "::warning title=attribution-push::could not push the attribution commit to main (branch protection?), the release itself is unaffected"
            exit 0
          fi

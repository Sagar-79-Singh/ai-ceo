name: Release

# v1.0.6 ships standalone, self-contained executables built from the Avalonia desktop head:
#   * Windows (win-x64, win-x86, win-arm64) → a single .exe per architecture.
#   * Linux/macOS (linux-x64, linux-arm64, osx-x64, osx-arm64) → a .tar.gz per architecture.
#   * Windows x64 → AI-CEO-Orchestrator-<version>-win-x64-Setup.exe, compiled by Inno Setup
#     (installer.iss at the repo root) on a Windows runner using Chocolatey's innosetup package.
# No .zip and no .msix.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            artifact: AiCeo-win-x64.exe
          - rid: win-x86
            os: windows-latest
            artifact: AiCeo-win-x86.exe
          - rid: win-arm64
            os: windows-latest
            artifact: AiCeo-win-arm64.exe
          - rid: linux-x64
            os: ubuntu-latest
            artifact: AiCeo-linux-x64.tar.gz
          - rid: linux-arm64
            os: ubuntu-latest
            artifact: AiCeo-linux-arm64.tar.gz
          - rid: osx-x64
            os: macos-latest
            artifact: AiCeo-osx-x64.tar.gz
          - rid: osx-arm64
            os: macos-latest
            artifact: AiCeo-osx-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish ${{ matrix.rid }} (single file, self-contained)
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet publish src/AiCeo.Desktop/AiCeo.Desktop.csproj \
                -c Release -r ${{ matrix.rid }} \
                --self-contained true \
                -p:PublishSingleFile=true \
                -p:IncludeNativeLibrariesForSelfExtract=true \
                -p:DebugType=none \
                -p:DebugSymbols=false \
                2>&1 | tee "$RUNNER_TEMP/publish.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|error MSB|error NU" "$RUNNER_TEMP/publish.log" | head -8 | tr '\n' '|')
            echo "::error title=publish-failed::${MSG:0:1800}"
            tail -40 "$RUNNER_TEMP/publish.log"
            exit 1
          fi

      - name: Locate the single-file executable
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="src/AiCeo.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish"

          if [ "${{ matrix.rid }}" = "win-x64" ] || [ "${{ matrix.rid }}" = "win-x86" ] || [ "${{ matrix.rid }}" = "win-arm64" ]; then
            EXE="$ROOT/AiCeo.exe"
          else
            EXE="$ROOT/AiCeo"
          fi

          if [ ! -f "$EXE" ]; then
            echo "publish output:"
            ls -la "$ROOT" || true
            echo "::error title=missing-binary::no executable at $EXE"
            exit 1
          fi

          echo "binary: $EXE ($(du -h "$EXE" | cut -f1))"
          echo "path=$EXE" >> "$GITHUB_OUTPUT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Smoke test the executable (--self-test)
        shell: bash
        run: |
          set +e
          EXE="${{ steps.locate.outputs.path }}"
          ROOT="${{ steps.locate.outputs.root }}"
          export AICEO_DB_PATH="$RUNNER_TEMP/smoke/aiceo.db"
          mkdir -p "$RUNNER_TEMP/smoke"

          if [ "${{ matrix.rid }}" = "win-x64" ] || [ "${{ matrix.rid }}" = "win-x86" ] || [ "${{ matrix.rid }}" = "win-arm64" ]; then
            if [ "${{ matrix.rid }}" != "win-x64" ]; then
              echo "cross-architecture binary (${{ matrix.rid }}): execution skipped on an x64 runner"
              exit 0
            fi
          fi

          if [ "${{ matrix.rid }}" = "win-arm64" ] || [ "${{ matrix.rid }}" = "linux-arm64" ]; then
            echo "arm64 binary: execution skipped on an x64 runner"
            exit 0
          fi

          "$EXE" --self-test 2>&1 | tee "$RUNNER_TEMP/selftest.log"
          CODE=${PIPESTATUS[0]}
          echo "self-test exit code: $CODE"

          if [ "$CODE" -ne 0 ]; then
            echo "::error title=selftest-failed::the published binary did not pass --self-test"
            exit 1
          fi

          if ! grep -q "SELF-TEST OK" "$RUNNER_TEMP/selftest.log"; then
            if [ -f "$ROOT/self-test.log" ] && grep -q "SELF-TEST OK" "$ROOT/self-test.log"; then
              echo "self-test reported OK via self-test.log"
            else
              echo "::error title=selftest-report::SELF-TEST OK was not reported"
              exit 1
            fi
          fi

      - name: Assemble the release asset (Windows .exe)
        if: startsWith(matrix.rid, 'win-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${{ steps.locate.outputs.path }}" "dist/${{ matrix.artifact }}"
          ls -la dist

      - name: Assemble the release asset (.tar.gz)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist stage
          cp "${{ steps.locate.outputs.path }}" stage/AiCeo
          chmod +x stage/AiCeo
          cp README.md stage/README.md
          tar -czf "dist/${{ matrix.artifact }}" -C stage .
          rm -rf stage
          ls -la dist

      - name: Upload the asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  installer:
    name: Windows installer (Inno Setup)
    needs: publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the published win-x64 executable
        uses: actions/download-artifact@v4
        with:
          name: AiCeo-win-x64.exe
          path: dist

      - name: Install Inno Setup via Chocolatey
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1).FullName
          }
          if (-not $iscc) {
            Write-Host "::error title=no-inno-setup::ISCC.exe was not installed by Chocolatey"
            exit 1
          }
          Write-Host "ISCC: $iscc"
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compile the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path "src/AiCeo.Desktop/AiCeo.Desktop.csproj" -Pattern "<Version>([^<]+)</Version>").Matches[0].Groups[1].Value
          Write-Host "building Setup.exe for version $version"

          $log = Join-Path $env:RUNNER_TEMP "iscc.log"
          & $env:ISCC "/DAppVersion=$version" "/DAppSourceExe=dist\AiCeo-win-x64.exe" "installer.iss" 2>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $errors = (Select-String -Path $log -Pattern "Error|error" | Select-Object -First 6 |
              ForEach-Object { $_.Line.Trim() }) -join " | "
            Write-Host "::error title=iscc-failed::$($errors.Substring(0, [Math]::Min(1800, $errors.Length)))"
            exit 1
          }

      - name: Verify the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path "src/AiCeo.Desktop/AiCeo.Desktop.csproj" -Pattern "<Version>([^<]+)</Version>").Matches[0].Groups[1].Value
          $expected = "AI-CEO-Orchestrator-$version-win-x64-Setup.exe"
          $setup = Join-Path "dist/installer" $expected

          Get-ChildItem "dist/installer" -ErrorAction SilentlyContinue | Select-Object Name, Length

          if (-not (Test-Path $setup)) {
            Write-Host "::error title=missing-installer::$expected was not produced"
            exit 1
          }

          $header = [System.IO.File]::ReadAllBytes($setup)[0..1]
          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
            Write-Host "::error title=bad-installer::the installer is not a Windows executable"
            exit 1
          }

          $sizeMb = [Math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "installer: $expected ($sizeMb MB)"
          if ((Get-Item $setup).Length -lt 5MB) {
            Write-Host "::error title=small-installer::the installer does not contain the application"
            exit 1
          }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-CEO-Orchestrator-Setup.exe
          path: dist/installer/*-Setup.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [publish, installer]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download every asset
        uses: actions/download-artifact@v4
        with:
          path: ./assets
          merge-multiple: true

      - name: Verify the release contents
        shell: bash
        run: |
          set -euo pipefail
          ls -la ./assets

          for asset in \
            AiCeo-win-x64.exe \
            AiCeo-win-x86.exe \
            AiCeo-win-arm64.exe \
            AI-CEO-Orchestrator-1.0.6-win-x64-Setup.exe \
            AiCeo-linux-x64.tar.gz \
            AiCeo-linux-arm64.tar.gz \
            AiCeo-osx-x64.tar.gz \
            AiCeo-osx-arm64.tar.gz
          do
            if [ ! -f "./assets/$asset" ]; then
              echo "::error title=missing-asset::$asset was not produced"
              exit 1
            fi
          done

          # The Windows binaries must be real PE files; the archives must be gzip.
          for exe in ./assets/AiCeo-win-*.exe; do
            if [ "$(head -c 2 "$exe")" != "MZ" ]; then
              echo "::error title=bad-exe::$(basename "$exe") is not a Windows executable"
              exit 1
            fi
          done

          for archive in ./assets/*.tar.gz; do
            if ! tar -tzf "$archive" > /dev/null; then
              echo "::error title=bad-archive::$(basename "$archive") is not a valid .tar.gz"
              exit 1
            fi
          done

          # Checksums for every asset.
          cd ./assets
          : > SHA256SUMS.txt
          for file in $(ls | grep -v -E '^SHA256SUMS\.txt$|\.sha256$' | sort); do
            sha256sum "$file" > "$file.sha256"
            cat "$file.sha256" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: AI CEO Orchestrator v1.0.6
          tag_name: v1.0.6
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## AI CEO Orchestrator v1.0.6

            A **cross-platform desktop** AI orchestrator (.NET 10 · Avalonia UI) that opens in a native
            window — no browser, no local web server. Workers can read, write and run commands inside
            a folder you choose.

            ### Download and run

            | Platform | File | How |
            | --- | --- | --- |
            | **Windows x64 (recommended)** | `AI-CEO-Orchestrator-1.0.6-win-x64-Setup.exe` | Double-click the installer: Start-menu + desktop shortcuts, per-user, no admin rights. |
            | Windows x64 (portable) | `AiCeo-win-x64.exe` | Double-click. Nothing is installed. |
            | Windows x86 (32-bit) | `AiCeo-win-x86.exe` | Double-click. Older 32-bit machines. |
            | Windows ARM64 | `AiCeo-win-arm64.exe` | Double-click. Surface / Snapdragon PCs. |
            | Linux x64 | `AiCeo-linux-x64.tar.gz` | `tar -xzf …` then `./AiCeo` |
            | Linux ARM64 | `AiCeo-linux-arm64.tar.gz` | `tar -xzf …` then `./AiCeo` |
            | macOS Intel | `AiCeo-osx-x64.tar.gz` | `tar -xzf …` then `./AiCeo` |
            | macOS Apple Silicon | `AiCeo-osx-arm64.tar.gz` | `tar -xzf …` then `./AiCeo` |

            Every portable file is a **single, self-contained executable**: the .NET runtime is inside
            it, so nothing needs to be installed first. The database lives in your per-user data
            folder (`%APPDATA%\AiCeoOrchestrator` on Windows, `~/.local/share/AiCeoOrchestrator` on
            Linux, `~/Library/Application Support/AiCeoOrchestrator` on macOS). Override it with
            `AICEO_DB_PATH`.

            Windows SmartScreen may warn because the build is not code-signed: **More info → Run anyway**.
            On Linux you may need `chmod +x AiCeo`; on macOS, if Gatekeeper blocks an unsigned binary,
            right-click → **Open**.

            ### What's new in v1.0.6 — the Nexus interface

            The plain desktop shell has been replaced by **Nexus**, the interface from the new
            design: a dark obsidian console with a live WebGL holographic core behind the execution
            feed, the swarm matrix down the left, and a glowing console dock across the bottom.

            - **Embedded HTML surface.** The layout is rendered by the platform's native web engine
              (`Avalonia.Controls.WebView`): Edge WebView2 on Windows, WKWebView on macOS and
              WebKitGTK on Linux. The page, its precompiled Tailwind stylesheet and the icon font are
              bundled inside the executable, so the interface looks identical offline — no CDN, no
              local web server, no Node.js.
            - **Live execution feed.** The gyroscope emblem, badge row and neural-wave telemetry give
              way to the real run: CEO plan steps, one delegation at a time, tool calls with their
              output, worker results and the synthesised final answer, streamed straight from the
              orchestrator.
            - **Swarm matrix.** Every agent with its role, provider, model and tool flag; promote any
              worker to CEO, edit or remove one, or deploy a new agent, all from the sidebar.
            - **Select Workspace** still opens the native folder picker and the sandbox guard is
              unchanged — workers cannot read or write outside the folder you choose.
            - **Dispatch Swarm** sends your directive to the CEO through exactly the same
              orchestrator path as before (strict star topology, sequential delegation).
            - **Settings modal** (sliders button, top right): Dark / Light / System theme, five accent
              colours and three text sizes, painted instantly and remembered in SQLite.
            - **Graceful fallback.** If a machine has no web engine (for example a bare Linux box
              without WebKitGTK), the app opens the previous Avalonia interface instead of failing,
              and offers a one-click switch from the Nexus window.

            The installer was refreshed for this release: same dark modern wizard, new version,
            same per-user install with desktop and Start-menu shortcuts.

            ### Unchanged
            Strict star topology (you ↔ CEO only, one worker at a time), multi-provider LLM support
            (OmniRoute / OpenAI / Gemini / custom), masked API keys, **Select Workspace Folder**, and
            the workspace-confined `list_files` / `read_file` / `write_file` / `run_command` tool loop.

            ### Windows 7 / 8 note
            .NET 10 — bundled inside these executables — officially supports Windows 10 1809 (build
            17763) and newer only; the installer enforces that floor. On Windows 7/8.1 the process
            fails before any application code runs, so no `crash.log` is produced. `AiCeo-win-x86.exe`
            is the right build for 32-bit Windows 10 machines.

            ### Verify the download
            `SHA256SUMS.txt` (and a `.sha256` per file) is attached to the release.
          files: |
            assets/*.exe
            assets/*.tar.gz
            assets/*.sha256
            assets/SHA256SUMS.txt

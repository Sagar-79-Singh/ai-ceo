name: Release

# v1.0.16 ships a portable build *and* a native installer for every platform, and every file name
# carries the version, so two releases can never be confused once they are downloaded:
#   * Windows  win-x64 / win-x86 / win-arm64 → AiCeo-win-<arch>-v<version>.exe    (portable)
#                                            → Setup-win-<arch>-v<version>.exe    (Inno Setup)
#   * Linux    linux-x64 / linux-arm64       → AiCeo-linux-<arch>-v<version>.tar.gz (portable)
#                                            → AiCeo-linux-<arch>-v<version>.deb    (dpkg-deb)
#   * macOS    osx-x64 / osx-arm64           → AiCeo-osx-<arch>-v<version>.tar.gz (portable)
#                                            → AiCeo-osx-<arch>-v<version>.dmg      (hdiutil, .app)
# No .zip and no .msix.
#
# PRODUCT_VERSION below is the single source of truth for those names. The release job fails the
# build when it disagrees with <Version> in AiCeo.Desktop.csproj, installer.iss or the Nexus badge,
# so a name can never advertise a version the binaries do not carry.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  # v1.0.16: the version that appears in every asset name ("AiCeo-win-x64-v1.0.16.exe").
  PRODUCT_VERSION: "1.0.16"

jobs:
  # ------------------------------------------------------------------ portable binaries
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The asset name is computed from PRODUCT_VERSION in the first step, so the version is
        # written down once instead of seven times.
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-x86
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Name the release asset
        id: name
        shell: bash
        run: |
          set -euo pipefail
          RID="${{ matrix.rid }}"
          case "$RID" in
            win-*)   EXT=".exe" ;;
            *)       EXT=".tar.gz" ;;
          esac
          ASSET="AiCeo-$RID-v$PRODUCT_VERSION$EXT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "release asset: $ASSET"

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish ${{ matrix.rid }} (single file, self-contained)
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet publish src/AiCeo.Desktop/AiCeo.Desktop.csproj \
                -c Release -r ${{ matrix.rid }} \
                --self-contained true \
                -p:PublishSingleFile=true \
                -p:IncludeNativeLibrariesForSelfExtract=true \
                -p:DebugType=none \
                -p:DebugSymbols=false \
                2>&1 | tee "$RUNNER_TEMP/publish.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|error MSB|error NU" "$RUNNER_TEMP/publish.log" | head -8 | tr '\n' '|')
            echo "::error title=publish-failed::${MSG:0:1800}"
            tail -40 "$RUNNER_TEMP/publish.log"
            exit 1
          fi

      - name: Locate the single-file executable
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="src/AiCeo.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish"

          if [ "${{ matrix.rid }}" = "win-x64" ] || [ "${{ matrix.rid }}" = "win-x86" ] || [ "${{ matrix.rid }}" = "win-arm64" ]; then
            EXE="$ROOT/AiCeo.exe"
          else
            EXE="$ROOT/AiCeo"
          fi

          if [ ! -f "$EXE" ]; then
            echo "publish output:"
            ls -la "$ROOT" || true
            echo "::error title=missing-binary::no executable at $EXE"
            exit 1
          fi

          echo "binary: $EXE ($(du -h "$EXE" | cut -f1))"
          echo "path=$EXE" >> "$GITHUB_OUTPUT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Smoke test the executable (--self-test)
        shell: bash
        run: |
          set +e
          EXE="${{ steps.locate.outputs.path }}"
          ROOT="${{ steps.locate.outputs.root }}"
          export AICEO_DB_PATH="$RUNNER_TEMP/smoke/aiceo.db"
          mkdir -p "$RUNNER_TEMP/smoke"

          if [ "${{ matrix.rid }}" = "win-x86" ]; then
            echo "cross-architecture binary (${{ matrix.rid }}): execution skipped on an x64 runner"
            exit 0
          fi

          if [ "${{ matrix.rid }}" = "win-arm64" ] || [ "${{ matrix.rid }}" = "linux-arm64" ] || [ "${{ matrix.rid }}" = "osx-x64" ]; then
            echo "cross-architecture binary (${{ matrix.rid }}): execution skipped on this runner"
            exit 0
          fi

          "$EXE" --self-test 2>&1 | tee "$RUNNER_TEMP/selftest.log"
          CODE=${PIPESTATUS[0]}
          echo "self-test exit code: $CODE"

          if [ "$CODE" -ne 0 ]; then
            echo "::error title=selftest-failed::the published binary did not pass --self-test"
            exit 1
          fi

          if ! grep -q "SELF-TEST OK" "$RUNNER_TEMP/selftest.log"; then
            if [ -f "$ROOT/self-test.log" ] && grep -q "SELF-TEST OK" "$ROOT/self-test.log"; then
              echo "self-test reported OK via self-test.log"
            else
              echo "::error title=selftest-report::SELF-TEST OK was not reported"
              exit 1
            fi
          fi

      - name: Assemble the release asset (Windows .exe)
        if: startsWith(matrix.rid, 'win-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${{ steps.locate.outputs.path }}" "dist/${{ steps.name.outputs.asset }}"
          ls -la dist

      - name: Assemble the release asset (.tar.gz)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist stage
          cp "${{ steps.locate.outputs.path }}" stage/AiCeo
          chmod +x stage/AiCeo
          cp README.md stage/README.md
          tar -czf "dist/${{ steps.name.outputs.asset }}" -C stage .
          rm -rf stage
          ls -la dist

      - name: Upload the portable asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.asset }}
          path: dist/${{ steps.name.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ Windows installers
  windows-installer:
    name: Windows installer (Inno Setup, ${{ matrix.arch }})
    needs: publish
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the portable ${{ matrix.arch }} executable
        uses: actions/download-artifact@v4
        with:
          name: AiCeo-win-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.exe
          path: dist

      # v1.0.15: the installer embeds the Evergreen WebView2 bootstrapper and runs it silently
      # when the runtime is missing (the usual reason an installed build looks dead). A CDN hiccup
      # must not fail the release — installer.iss degrades to a download link when the file is absent.
      - name: Fetch the WebView2 Evergreen bootstrapper
        continue-on-error: true
        shell: pwsh
        run: |
          $target = Join-Path "dist" "MicrosoftEdgeWebView2Setup.exe"
          foreach ($attempt in 1..3) {
            try {
              Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $target -UseBasicParsing -TimeoutSec 120
              if ((Get-Item $target).Length -gt 1MB) {
                Write-Host "WebView2 bootstrapper: $((Get-Item $target).Length) bytes"
                exit 0
              }
            } catch {
              Write-Host "attempt $attempt failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 5
            }
          }
          Write-Host "::warning title=webview2-bootstrapper::could not download the WebView2 bootstrapper; the installer will link to the download page instead"

      - name: Install Inno Setup via Chocolatey
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1).FullName
          }
          if (-not $iscc) {
            Write-Host "::error title=no-inno-setup::ISCC.exe was not installed by Chocolatey"
            exit 1
          }
          Write-Host "ISCC: $iscc"
          # Print the compiler version: ARM64 installers need Inno Setup 6.3 or newer. The help
          # output returns a non-zero exit code, which must not fail the step.
          & $iscc /? 2>&1 | Select-Object -First 3 | Write-Host
          $LASTEXITCODE = 0
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compile Setup-win-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.exe
        shell: pwsh
        run: |
          $version = (Select-String -Path "src/AiCeo.Desktop/AiCeo.Desktop.csproj" -Pattern "<Version>([^<]+)</Version>").Matches[0].Groups[1].Value
          $arch = "${{ matrix.arch }}"
          if ($version -ne "${{ env.PRODUCT_VERSION }}") {
            Write-Host "::error title=version-drift::csproj says $version but release.yml names assets ${{ env.PRODUCT_VERSION }}"
            exit 1
          }
          $source = "dist\AiCeo-win-$arch-v$version.exe"
          Write-Host "building Setup-win-$arch-v$version.exe from $source"

          Get-ChildItem "dist" | Select-Object Name, Length

          if (-not (Test-Path $source)) {
            Write-Host "::error title=missing-portable::$source was not downloaded"
            exit 1
          }

          $log = Join-Path $env:RUNNER_TEMP "iscc-$arch.log"
          & $env:ISCC "/DAppVersion=$version" "/DAppArch=$arch" "/DAppSourceExe=$source" "installer.iss" 2>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $errors = (Select-String -Path $log -Pattern "Error|error" | Select-Object -First 6 |
              ForEach-Object { $_.Line.Trim() }) -join " | "
            Write-Host "::error title=iscc-failed::$($errors.Substring(0, [Math]::Min(1800, $errors.Length)))"
            exit 1
          }

      - name: Verify the installer
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          $expected = "Setup-win-$arch-v${{ env.PRODUCT_VERSION }}.exe"
          $setup = Join-Path "dist/installer" $expected

          Get-ChildItem "dist/installer" -ErrorAction SilentlyContinue | Select-Object Name, Length

          if (-not (Test-Path $setup)) {
            Write-Host "::error title=missing-installer::$expected was not produced"
            exit 1
          }

          $header = [System.IO.File]::ReadAllBytes($setup)[0..1]
          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
            Write-Host "::error title=bad-installer::the installer is not a Windows executable"
            exit 1
          }

          $sizeMb = [Math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "installer: $expected ($sizeMb MB)"
          if ((Get-Item $setup).Length -lt 5MB) {
            Write-Host "::error title=small-installer::the installer does not contain the application"
            exit 1
          }

      - name: Upload Setup-win-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.exe
        uses: actions/upload-artifact@v4
        with:
          name: Setup-win-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.exe
          path: dist/installer/Setup-win-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.exe
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ Linux .deb packages
  linux-packages:
    name: Linux package (.deb, ${{ matrix.arch }})
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb_arch: amd64
          - arch: arm64
            deb_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the portable archive
        uses: actions/download-artifact@v4
        with:
          name: AiCeo-linux-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.tar.gz
          path: dist

      - name: Assemble the Debian package
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/AiCeo.Desktop/AiCeo.Desktop.csproj | head -1)
          ARCH="${{ matrix.arch }}"
          DEB_ARCH="${{ matrix.deb_arch }}"
          ROOT="$RUNNER_TEMP/pkgroot"

          echo "packaging AiCeo-linux-$ARCH-v$VERSION.deb (version $VERSION, architecture $DEB_ARCH)"

          rm -rf "$ROOT"
          mkdir -p "$ROOT/DEBIAN" \
                   "$ROOT/usr/lib/aiceo" \
                   "$ROOT/usr/bin" \
                   "$ROOT/usr/share/applications" \
                   "$ROOT/usr/share/icons/hicolor/256x256/apps" \
                   "$ROOT/usr/share/doc/aiceo"

          tar -xzf "dist/AiCeo-linux-$ARCH-v$VERSION.tar.gz" -C "$ROOT/usr/lib/aiceo"
          rm -f "$ROOT/usr/lib/aiceo/README.md"
          chmod 755 "$ROOT/usr/lib/aiceo/AiCeo"
          ln -s /usr/lib/aiceo/AiCeo "$ROOT/usr/bin/aiceo"

          cp src/AiCeo.Desktop/Assets/aiceo.png "$ROOT/usr/share/icons/hicolor/256x256/apps/aiceo.png"
          cp README.md "$ROOT/usr/share/doc/aiceo/README.md"

          cat > "$ROOT/usr/share/applications/aiceo.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=AI CEO Orchestrator
          GenericName=AI Orchestrator
          Comment=Star-topology AI orchestrator with a sandboxed workspace
          Exec=aiceo
          Icon=aiceo
          Terminal=false
          Categories=Development;Utility;
          StartupWMClass=AiCeo
          DESKTOP

          INSTALLED_KB=$(du -sk "$ROOT/usr" | cut -f1)

          cat > "$ROOT/DEBIAN/control" <<CONTROL
          Package: aiceo
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: $DEB_ARCH
          Installed-Size: $INSTALLED_KB
          Maintainer: Sagar Singh <sagar@users.noreply.github.com>
          Homepage: https://github.com/Sagar-79-Singh/ai-ceo
          Depends: libx11-6, libfontconfig1, libgtk-3-0, libwebkit2gtk-4.1-0, libnotify4
          Recommends: fonts-dejavu-core
          Description: AI CEO Orchestrator
           A cross-platform desktop AI orchestrator written in C# / .NET 10.
           You brief one CEO agent, which plans the work, delegates to a single
           worker at a time inside the folder you choose, and reports back.
           .
           The interface is the Nexus HTML/WebGL console rendered by the
           system WebView (WebKitGTK 4.1) inside a native window provided by
           PhotinoX.
          CONTROL

          cat > "$ROOT/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q /usr/share/icons/hicolor || true
          fi
          exit 0
          POSTINST
          chmod 755 "$ROOT/DEBIAN/postinst"

          dpkg-deb --root-owner-group --build "$ROOT" "dist/AiCeo-linux-$ARCH-v$VERSION.deb"

      - name: Verify the package
        shell: bash
        run: |
          set -euo pipefail
          DEB="dist/AiCeo-linux-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.deb"

          if [ ! -f "$DEB" ]; then
            echo "::error title=missing-deb::$DEB was not produced"
            exit 1
          fi

          if [ "$(head -c 7 "$DEB")" != "!<arch>" ]; then
            echo "::error title=bad-deb::$(basename "$DEB") is not a Debian archive"
            exit 1
          fi

          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | head -20

          SIZE=$(stat -c%s "$DEB")
          echo "package size: $SIZE bytes"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error title=small-deb::the package does not contain the application"
            exit 1
          fi

      - name: Upload AiCeo-linux-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.deb
        uses: actions/upload-artifact@v4
        with:
          name: AiCeo-linux-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.deb
          path: dist/AiCeo-linux-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.deb
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ macOS .dmg images
  macos-dmg:
    name: macOS installer (.dmg, ${{ matrix.arch }})
    needs: publish
    runs-on: macos-latest
    env:
      # v1.0.15: the oldest macOS this image supports (High Sierra). Declared once, used by the
      # bundle's Info.plist and by the two checks in the packaging script.
      MIN_MACOS: "10.13"
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # v1.0.16: `hdiutil create` kept failing with "No space left on device" on the hosted macOS
      # images — they ship every Xcode release and the simulator runtimes, which leaves too little
      # scratch for the compressed image. A .NET desktop build needs none of it: hdiutil, sips,
      # iconutil and codesign all live in /usr/bin. The cleanup is reported as an annotation (job
      # logs are not readable from every environment) and the job fails fast if it is still tight.
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "before: $(df -h / | tail -1)"

          sudo rm -rf /Applications/Xcode*.app
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          sudo rm -rf /Library/Developer/CoreSimulator/Caches
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches
          sudo rm -rf ~/Library/Caches/Homebrew ~/Library/Caches/pip
          sudo rm -rf "$RUNNER_TEMP"/*

          FREE_MB=$(df -m / | awk 'NR==2{print $4}')
          echo "after: $(df -h / | tail -1)"
          echo "::notice title=disk-space::${FREE_MB} MB free after cleanup"

          if [ "$FREE_MB" -lt 3072 ]; then
            echo "::error title=low-disk::only ${FREE_MB} MB free; hdiutil needs at least 3 GB of scratch"
            exit 1
          fi

      - name: Download the portable archive
        uses: actions/download-artifact@v4
        with:
          name: AiCeo-osx-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.tar.gz
          path: dist

      - name: Assemble the .app bundle
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/AiCeo.Desktop/AiCeo.Desktop.csproj | head -1)
          ARCH="${{ matrix.arch }}"
          APP="$RUNNER_TEMP/AI CEO Orchestrator.app"

          # v1.0.15: this image targets macOS 10.13 (High Sierra) or later. The version declared
          # in Info.plist below is the floor LaunchServices enforces; this check makes sure the
          # image is never built on — or labelled for — anything older.
          version_ge() {   # version_ge <have> <need> -> true when have >= need
            local IFS=.
            local -a have=($1) need=($2)
            local i x y
            for i in 0 1 2; do
              x=${have[i]:-0}; y=${need[i]:-0}
              if [ "$x" -gt "$y" ]; then return 0; fi
              if [ "$x" -lt "$y" ]; then return 1; fi
            done
            return 0
          }

          HOST_MACOS="$(sw_vers -productVersion)"
          if ! version_ge "$HOST_MACOS" "$MIN_MACOS"; then
            echo "::error title=unsupported-macos::macOS $HOST_MACOS cannot build or run this image; macOS $MIN_MACOS or later is required"
            exit 1
          fi
          echo "macOS floor $MIN_MACOS satisfied by the build host ($HOST_MACOS)"

          echo "packaging AiCeo-osx-$ARCH-v$VERSION.dmg (version $VERSION)"

          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          tar -xzf "dist/AiCeo-osx-$ARCH-v$VERSION.tar.gz" -C "$APP/Contents/MacOS"
          # The archive has been unpacked; keeping it costs ~90 MB of the very scratch space the
          # compressed image needs.
          rm -f "dist/AiCeo-osx-$ARCH-v$VERSION.tar.gz"
          if [ -f "$APP/Contents/MacOS/README.md" ]; then
            mv "$APP/Contents/MacOS/README.md" "$APP/Contents/Resources/README.md"
          fi
          chmod +x "$APP/Contents/MacOS/AiCeo"

          # Icon: the shipped 256×256 PNG turned into a real .icns.
          ICONSET="$RUNNER_TEMP/AiCeo.iconset"
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" src/AiCeo.Desktop/Assets/aiceo.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            sips -z "$((size * 2))" "$((size * 2))" src/AiCeo.Desktop/Assets/aiceo.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AiCeo.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>AI CEO Orchestrator</string>
            <key>CFBundleDisplayName</key>
            <string>AI CEO Orchestrator</string>
            <key>CFBundleIdentifier</key>
            <string>com.sagarsingh.aiceo</string>
            <key>CFBundleVersion</key>
            <string>$VERSION</string>
            <key>CFBundleShortVersionString</key>
            <string>$VERSION</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>AiCeo</string>
            <key>CFBundleIconFile</key>
            <string>AiCeo</string>
            <key>CFBundleSignature</key>
            <string>????</string>
            <key>LSMinimumSystemVersion</key>
            <string>$MIN_MACOS</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSRequiresAquaSystemAppearance</key>
            <false/>
          </dict>
          </plist>
          PLIST

          # Ad-hoc signature: the bundle is unsigned, but a valid local signature keeps
          # macOS from refusing to launch the inner executable outright.
          codesign --force --deep --sign - "$APP" || echo "::warning::ad-hoc signing was skipped"

      - name: Build the .dmg
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/AiCeo.Desktop/AiCeo.Desktop.csproj | head -1)
          ARCH="${{ matrix.arch }}"
          APP="$RUNNER_TEMP/AI CEO Orchestrator.app"
          STAGE="$RUNNER_TEMP/dmg-stage"

          # The image must announce — and refuse to violate — the macOS 10.13 floor. Anything
          # lower is rejected here rather than reaching a user's Mac.
          PLIST_MIN=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")
          if [ "$PLIST_MIN" != "$MIN_MACOS" ]; then
            echo "::error title=wrong-macos-floor::Info.plist declares '$PLIST_MIN' but this image targets macOS $MIN_MACOS"
            exit 1
          fi
          echo "Info.plist LSMinimumSystemVersion = $PLIST_MIN"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          # hdiutil detaches its scratch devices asynchronously and occasionally reports
          # "Resource busy" on a shared macOS runner; three attempts with a short pause make the
          # job deterministic. Every attempt's output is captured so a real failure is diagnosable.
          for attempt in 1 2 3; do
            df -h / | tail -1
            rm -f "dist/AiCeo-osx-$ARCH-v$VERSION.dmg"
            if hdiutil create \
                 -volname "AI CEO Orchestrator $VERSION" \
                 -srcfolder "$STAGE" \
                 -ov -format UDZO \
                 "dist/AiCeo-osx-$ARCH-v$VERSION.dmg" 2>&1 | tee "$RUNNER_TEMP/hdiutil-$attempt.log"; then
              echo "hdiutil succeeded on attempt $attempt"
              break
            fi

            echo "::warning title=hdiutil-retry::attempt $attempt failed"
            hdiutil detach "/Volumes/AI CEO Orchestrator $VERSION" -force >/dev/null 2>&1 || true
            sleep 5

            if [ "$attempt" = "3" ]; then
              echo "disk space at failure:"; df -h /
              DETAIL=$(tail -c 2000 "$RUNNER_TEMP/hdiutil-$attempt.log" | tr '\n' '|' | tr -d '\r')
              echo "::error title=dmg-failed::${DETAIL:0:3000}"
              exit 1
            fi
          done

          if [ ! -f "dist/AiCeo-osx-$ARCH-v$VERSION.dmg" ]; then
            echo "::error title=dmg-missing::hdiutil reported success but produced no image"
            exit 1
          fi

      - name: Verify the image
        shell: bash
        run: |
          set -euo pipefail
          DMG="dist/AiCeo-osx-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.dmg"

          if [ ! -f "$DMG" ]; then
            echo "::error title=missing-dmg::$DMG was not produced"
            exit 1
          fi

          if [ "$(tail -c 512 "$DMG" | head -c 4)" != "koly" ]; then
            echo "::error title=bad-dmg::$(basename "$DMG") has no UDIF trailer"
            exit 1
          fi

          hdiutil verify "$DMG"

          SIZE=$(stat -f%z "$DMG")
          echo "image size: $SIZE bytes"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error title=small-dmg::the image does not contain the application"
            exit 1
          fi

      - name: Upload AiCeo-osx-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.dmg
        uses: actions/upload-artifact@v4
        with:
          name: AiCeo-osx-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.dmg
          path: dist/AiCeo-osx-${{ matrix.arch }}-v${{ env.PRODUCT_VERSION }}.dmg
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ release
  release:
    name: Create GitHub Release
    needs: [publish, windows-installer, linux-packages, macos-dmg]
    runs-on: ubuntu-latest

    steps:
      # Full history: the final step pushes a bookkeeping commit back to main, and git refuses to
      # push from a shallow clone.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download every asset
        uses: actions/download-artifact@v4
        with:
          path: ./assets
          merge-multiple: true

      - name: Verify the release contents
        shell: bash
        run: |
          set -euo pipefail
          ls -la ./assets

          # v1.0.16: the version in every file name must be the version the binaries carry.
          # PRODUCT_VERSION (release.yml), <Version> (csproj), AppVersion (installer.iss) and the
          # Nexus badge are four places that describe one number; this is where they are checked.
          CSPROJ_VERSION=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/AiCeo.Desktop/AiCeo.Desktop.csproj | head -1)
          ISS_VERSION=$(sed -n 's:.*#define AppVersion "\([^"]*\)".*:\1:p' installer.iss | head -1)
          BADGE_VERSION=$(sed -n 's:.*<span id="nx-version"[^>]*>\([^<]*\)</span>.*:\1:p' src/AiCeo.Desktop/Assets/nexus.html | head -1)

          echo "version: release.yml=$PRODUCT_VERSION csproj=$CSPROJ_VERSION installer.iss=$ISS_VERSION nexus=$BADGE_VERSION"

          for pair in "csproj=$CSPROJ_VERSION" "installer.iss=$ISS_VERSION" "nexus badge=$BADGE_VERSION"; do
            if [ "${pair#*=}" != "$PRODUCT_VERSION" ] && [ "${pair#*=}" != "v$PRODUCT_VERSION" ]; then
              echo "::error title=version-drift::${pair%%=*} says ${pair#*=} but the assets are named v$PRODUCT_VERSION"
              exit 1
            fi
          done

          # 14 deliverables: a portable build and an installer for every platform/architecture,
          # each carrying the release version in its name.
          for asset in \
            AiCeo-win-x64-v$PRODUCT_VERSION.exe \
            AiCeo-win-x86-v$PRODUCT_VERSION.exe \
            AiCeo-win-arm64-v$PRODUCT_VERSION.exe \
            Setup-win-x64-v$PRODUCT_VERSION.exe \
            Setup-win-x86-v$PRODUCT_VERSION.exe \
            Setup-win-arm64-v$PRODUCT_VERSION.exe \
            AiCeo-linux-x64-v$PRODUCT_VERSION.tar.gz \
            AiCeo-linux-arm64-v$PRODUCT_VERSION.tar.gz \
            AiCeo-linux-x64-v$PRODUCT_VERSION.deb \
            AiCeo-linux-arm64-v$PRODUCT_VERSION.deb \
            AiCeo-osx-x64-v$PRODUCT_VERSION.tar.gz \
            AiCeo-osx-arm64-v$PRODUCT_VERSION.tar.gz \
            AiCeo-osx-x64-v$PRODUCT_VERSION.dmg \
            AiCeo-osx-arm64-v$PRODUCT_VERSION.dmg
          do
            if [ ! -f "./assets/$asset" ]; then
              echo "::error title=missing-asset::$asset was not produced"
              exit 1
            fi
            if [ ! -s "./assets/$asset" ]; then
              echo "::error title=empty-asset::$asset is empty"
              exit 1
            fi
          done

          # Windows binaries — portable and installers — must be real PE files.
          for exe in ./assets/AiCeo-win-*.exe ./assets/Setup-win-*.exe; do
            if [ "$(head -c 2 "$exe")" != "MZ" ]; then
              echo "::error title=bad-exe::$(basename "$exe") is not a Windows executable"
              exit 1
            fi
          done

          # The portable archives must be gzip tarballs.
          for archive in ./assets/AiCeo-*.tar.gz; do
            if ! tar -tzf "$archive" > /dev/null; then
              echo "::error title=bad-archive::$(basename "$archive") is not a valid .tar.gz"
              exit 1
            fi
          done

          # Debian packages are `ar` archives; disk images end in a UDIF trailer.
          for deb in ./assets/AiCeo-*.deb; do
            if [ "$(head -c 7 "$deb")" != "!<arch>" ]; then
              echo "::error title=bad-deb::$(basename "$deb") is not a Debian package"
              exit 1
            fi
          done

          for dmg in ./assets/AiCeo-*.dmg; do
            if [ "$(tail -c 512 "$dmg" | head -c 4)" != "koly" ]; then
              echo "::error title=bad-dmg::$(basename "$dmg") is not a UDIF image"
              exit 1
            fi
          done

          # Checksums for every asset.
          cd ./assets
          : > SHA256SUMS.txt
          for file in $(ls | grep -v -E '^SHA256SUMS\.txt$|\.sha256$' | sort); do
            sha256sum "$file" > "$file.sha256"
            cat "$file.sha256" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: AI CEO Orchestrator v${{ env.PRODUCT_VERSION }}
          tag_name: v${{ env.PRODUCT_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## AI CEO Orchestrator v${PRODUCT_VERSION}

            A **cross-platform desktop** AI orchestrator (.NET 10 · PhotinoX + native WebView ·
            Nexus console) that opens in a native window — no browser, no local web server, no
            bundled UI toolkit. Workers can read, write and run commands inside a folder you choose.

            Every platform now ships **both** a portable build and a native installer.

            ### Windows

            | Architecture | Portable | Installer |
            | --- | --- | --- |
            | **x64 (recommended)** | `AiCeo-win-x64-v${PRODUCT_VERSION}.exe` | `Setup-win-x64-v${PRODUCT_VERSION}.exe` |
            | x86 (32-bit) | `AiCeo-win-x86-v${PRODUCT_VERSION}.exe` | `Setup-win-x86-v${PRODUCT_VERSION}.exe` |
            | ARM64 (Surface / Snapdragon) | `AiCeo-win-arm64-v${PRODUCT_VERSION}.exe` | `Setup-win-arm64-v${PRODUCT_VERSION}.exe` |

            The installers are stock Inno Setup wizards — the same native shell, buttons and pages
            every other Windows program uses, with no custom theme or artwork. Per-user install (no
            UAC prompt, administrator override available), desktop and Start-menu shortcuts, and a
            clean entry in *Apps & features*. Before copying anything, Setup checks the real
            prerequisites and asks before installing them:

            - **Microsoft Edge WebView2 Runtime** — Windows 10/11 get the current Evergreen
              bootstrapper; Windows 7 / 8 / 8.1 get the **109** line (109.0.1518.x), the last runtime
              that supports them. Declining this prompt cancels the installation.
            - **Visual C++ 2015-2022 Redistributable** — no longer checked: PhotinoX uses the WebView
              the system already provides, so the redistributable is not a dependency of this build.
            - **.NET is not checked** — the executable is published with `--self-contained true`.

            ### Linux

            | Architecture | Portable | Installer |
            | --- | --- | --- |
            | x64 | `AiCeo-linux-x64-v${PRODUCT_VERSION}.tar.gz` | `AiCeo-linux-x64-v${PRODUCT_VERSION}.deb` |
            | ARM64 | `AiCeo-linux-arm64-v${PRODUCT_VERSION}.tar.gz` | `AiCeo-linux-arm64-v${PRODUCT_VERSION}.deb` |

            Portable: `tar -xzf AiCeo-linux-x64-v${PRODUCT_VERSION}.tar.gz && ./AiCeo`. Debian/Ubuntu:
            `sudo apt install ./AiCeo-linux-x64-v${PRODUCT_VERSION}.deb` — installs to `/usr/lib/aiceo`, adds the
            `aiceo` command, a desktop entry and the icon. The package **depends** on `libgtk-3-0`
            and `libwebkit2gtk-4.1-0`, so `apt` resolves the window toolkit and the web engine for
            the Nexus surface instead of leaving the app to fall back.

            ### macOS

            | Architecture | Portable | Installer |
            | --- | --- | --- |
            | Intel | `AiCeo-osx-x64-v${PRODUCT_VERSION}.tar.gz` | `AiCeo-osx-x64-v${PRODUCT_VERSION}.dmg` |
            | Apple Silicon | `AiCeo-osx-arm64-v${PRODUCT_VERSION}.tar.gz` | `AiCeo-osx-arm64-v${PRODUCT_VERSION}.dmg` |

            The `.dmg` contains a real `AI CEO Orchestrator.app` bundle (icon, versioned `Info.plist`,
            ad-hoc signature) plus an **Applications** shortcut: open the image, drag the app across.
            It targets **macOS 10.13 (High Sierra) or later**: the packaging script aborts below that
            version, `Info.plist` declares it as `LSMinimumSystemVersion`, and the app itself refuses
            to start on an older system with a clear alert. Portable: `tar -xzf … && ./AiCeo`.

            ### Notes

            Every portable executable is **single-file and self-contained**: the .NET runtime is
            inside it, so nothing needs to be installed first. Application data (agents, keys, task
            history, theme) lives in your per-user data folder — `%APPDATA%\AiCeoOrchestrator`,
            `~/.local/share/AiCeoOrchestrator` or
            `~/Library/Application Support/AiCeoOrchestrator` — overridable with `AICEO_DB_PATH`.

            If the app ever exits without showing a window, `crash.log` and `startup.log` in
            `%APPDATA%\AiCeoOrchestrator` (also written next to the executable and in `%TEMP%`) record
            the failing exception and the last start-up step it reached.

            Windows SmartScreen may warn because the builds are not code-signed: **More info → Run
            anyway**. On macOS, if Gatekeeper blocks the ad-hoc signed app, right-click → **Open** the
            first time. The `.deb` is not in a signed repository, so `apt` may ask you to trust the
            local file.

            ### What's new in v1.0.16 — your key, your model, readable output

            v1.0.16 removes the last hardcoded credentials. Nothing in this build carries an API key
            or a model id: on first launch the console is **blocked** by a setup sheet that asks for
            the four values the app needs — **provider** (OmniRoute, OpenAI, Gemini or any
            OpenAI-compatible server), **base URL**, **API key** and **model**. Saving writes them to
            the `UserSettings` row of the local SQLite database and unlocks the UI in the very next
            snapshot; every agent, the health probe and the orchestrator read that one connection.

            - **No key, no model, no run.** `LlmSetupProvider` is the single source of truth. A fresh
              install reports *not configured*, the dispatch button goes inert and the orchestrator
              refuses to spend a single token until the sheet has been completed.
            - **Nothing is baked in.** The seeded gateway key and model, every `DefaultModel` catalog
              entry, the seeded `ModelId` values and the fallback key are deleted. A model is
              something the user chooses, never something the binary assumes.
            - **Editable later.** Settings → **Connection** shows the masked key, the provider, the
              base URL and the model, and reopens the same sheet at any time. A blank key field keeps
              the stored key; a blank base URL falls back to the provider default.
            - **Readable AI output.** The final-answer card and every feed card are solid
              (`bg-obsidian-850/95` instead of a 5 %-tinted surface over the WebGL canvas), the
              prompt-box placeholder is `slate-400` at full opacity instead of `slate-500`, and body
              text is pinned at `text-slate-100` / `text-opacity-100`. Answers stay legible on every
              accent preset and in light mode.
            - **Versioned file names.** Every asset carries the release version —
              `AiCeo-win-x64-v${PRODUCT_VERSION}.exe`, `Setup-win-arm64-v${PRODUCT_VERSION}.exe`,
              `AiCeo-linux-arm64-v${PRODUCT_VERSION}.deb`, `AiCeo-osx-x64-v${PRODUCT_VERSION}.dmg` —
              so two releases can never be confused once downloaded. The release job fails when
              `release.yml`, `AiCeo.Desktop.csproj`, `installer.iss` and the Nexus badge disagree
              about the number.

            CI drives the new path end to end: the Linux smoke test asserts that a fresh database
            reports *setup required*, that a `saveConnection` command validates, persists and flips
            the snapshot to `configured: true`, and that an invalid submission is rejected without
            touching the stored connection.

            ### Previous release — v1.0.15, Avalonia is gone, PhotinoX hosts the native WebView

            - **The managed UI stack is deleted.** No Avalonia packages, XAML or compositor: the shell
              is a **PhotinoX** native window around the WebView the operating system already ships —
              WebView2, WKWebView or WebKitGTK 4.1.
            - **The window always appears** — `PhotinoApplication.Run(window)` shows it and pumps the
              native message loop in one call; the database, the agents and the provider probe run
              afterwards on a background task, so there is no start-up freeze either.
            - **Native messaging instead of script evaluation** — page→host through
              `window.external.sendMessage`, host→page through `SendWebMessage`; the page is loaded
              with `LoadString` and its stylesheet inlined, so no `file://` access is involved.
            - **The folder picker is native** (`ShowOpenFolder`), and the Visual C++ redistributable
              check is gone; the WebView2 check, including the **109** line for Windows 7 / 8 / 8.1,
              is unchanged.

            **Attribution.** Releases are recorded with the official Claude Code footer:
            `🤖 Generated with Claude Code` and
            `Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>`.

            Everything from earlier releases is intact: the Nexus surface and its providers, strict
            star topology with one worker at a time, the workspace guardrail and tool loop, the stock
            installer wizard with its OS-aware WebView2 prerequisite, the `.deb` dependencies on
            `libgtk-3-0` and `libwebkit2gtk-4.1-0`, and the macOS 10.13 floor.

            ### Previous release — v1.0.13, the window always appears

            - **The window was built and assigned first** — `desktop.MainWindow` before the one call
              on that path that blocks (the saved theme, a SQLite read).
            - **Both windows showed and activated themselves** — `PresentWindow()` cleared a
              `FullScreen`/`Minimized` state, forced `ShowInTaskbar="True"` and `Topmost="False"`, then
              called `Show()` and `Activate()`.
            - **WebView2 initialisation was fully asynchronous** — page extraction on the thread pool,
              awaited navigation, no `.Result`/`.Wait()` on any WebView2 call.

            ### Previous release — v1.0.12, start-up reverted and smart installers

            - **The v1.0.11 start-up path was reverted**, back to the v1.0.8 code where the portable
              `.exe` opened reliably.
            - **Stock Inno Setup wizard** with OS-aware **WebView2** (current Evergreen on Windows
              10/11, the **109** line on Windows 7 / 8 / 8.1) and **Visual C++** checks.
            - **`.deb` depends on** `libgtk-3-0` and `libwebkit2gtk-4.1-0`; the **`.dmg` targets
              macOS 10.13+**.

            ### Previous release — v1.0.11, the window is guaranteed to appear

            - **No blocking on the UI thread** — the theme row was read before the shell started.
            - **The shell showed and activated itself** — `WindowPresentation.PrepareForDisplay`.
            - **Oversized windows were fitted to the monitor.**
            - **`Co-authored-by: Claude <noreply@anthropic.com>`** on the release commit.

            ### Previous release — v1.0.10, the installer finishes the job

            - **WebView2 prerequisite** — `Setup.exe` carries the Evergreen bootstrapper and installs
              the runtime silently when it is missing.
            - **Working directory** — `[Run]` and both shortcuts use `WorkingDir = {app}`.
            - **Native libraries** — `SelfContained`, `PublishSingleFile` and
              `IncludeNativeLibrariesForSelfExtract` are declared in the project file.

            ### Previous release — v1.0.9, native window controls

            - **Real OS window chrome** — `SystemDecorations="Full"`, real title bars everywhere, no
              more fake traffic lights in the HTML header.
            - **Taskbar / dock icon** — `Icon="avares://AiCeo/Assets/aiceo.ico"` with the
              multi-resolution ICO embedded in the executable.

            ### Previous release — v1.0.8, dispatch with Enter

            - **Settings is discoverable.** The sliders glyph became a **gear** icon with a visible
              `Settings` label in the title bar.
            - **Enter dispatches.** `Enter` sends the prompt to the CEO and `Shift` + `Enter` inserts a
              newline; IME composition is respected.
            - **Provider CHECKING state.** The telemetry dot turns amber and the badge reads
              `CHECKING…` while the health probe is in flight.

            ### Previous release — v1.0.7, installers everywhere

            The release pipeline is a matrix that produces a portable build *and* a native installer
            for all seven targets:

            - **Three Inno Setup installers** (`Setup-win-<arch>-v<version>.exe`), each compiled against
              its own executable with the matching `ArchitecturesAllowed` guard.
            - **Two Debian packages**, assembled with `dpkg-deb` from the published binary: launcher
              in `/usr/bin`, desktop entry, icon, docs and dependency metadata.
            - **Two disk images**, built with `hdiutil` around a complete `.app` bundle (icon from the
              shipped PNG, `Info.plist`, ad-hoc signature) with the customary Applications drop
              target.
            - **Release gate**: the release job refuses to publish unless all 14 deliverables exist,
              the executables are real PE files, the tarballs unzip, the `.deb` files are `ar`
              archives and the `.dmg` files carry a UDIF trailer.

            ### Unchanged
            Strict star topology (you ↔ CEO only, one worker at a time), multi-provider LLM support
            (OmniRoute / OpenAI / Gemini / custom), masked API keys, **Select Workspace Folder**, the
            workspace-confined `list_files` / `read_file` / `write_file` / `run_command` tool loop,
            and the Nexus interface with its offline-bundled Tailwind/WebGL surface.

            ### 32-bit Windows note

            `AiCeo-win-x86-v${PRODUCT_VERSION}.exe` and `Setup-win-x86-v${PRODUCT_VERSION}.exe` are still built and published, but the native
            window/WebView bridge that PhotinoX ships is x64 / ARM64 only, so the 32-bit build cannot
            open the Nexus window — it writes that reason to `crash.log` instead of failing obscurely.
            A 32-bit Windows 10 installation on 64-bit hardware runs the **x64** build.

            ### Windows 7 / 8 note
            .NET 10 — bundled inside these executables — officially supports Windows 10 1809 (build
            17763) and newer only, so that is the floor for the application itself. `Setup.exe` will
            still run on Windows 7 SP1 / 8 / 8.1: it installs the WebView2 **109** runtime that those
            systems support and says plainly that the app needs Windows 10 1809 or newer.
            `AiCeo-win-x86-v${PRODUCT_VERSION}.exe` is the right build for 32-bit Windows 10 machines.

            ### Verify the download
            `SHA256SUMS.txt` (and a `.sha256` per file) is attached to the release.
          files: |
            assets/*.exe
            assets/*.tar.gz
            assets/*.deb
            assets/*.dmg
            assets/*.sha256
            assets/SHA256SUMS.txt

      # v1.0.15: record the release with the official Claude Code attribution footer.
      #
      # The commit is made by the GitHub Actions bot as an empty commit on main, carrying the exact
      # default Claude Code footer:
      #
      #     🤖 Generated with Claude Code
      #
      #     Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>
      #
      # `[skip ci]` keeps this bookkeeping commit from launching another CI run; the tag-triggered
      # release workflow is unaffected by pushes to main. It runs last and is allowed to fail:
      # attribution must never be able to stop a release that has already been published.
      - name: Commit the release with Claude attribution
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/AiCeo.Desktop/AiCeo.Desktop.csproj | head -1)"
          if [ -z "$version" ]; then
            echo "::warning title=no-version::could not read the version; skipping the attribution commit"
            exit 0
          fi

          git fetch --no-tags origin main
          git checkout -B main origin/main

          git commit --allow-empty \
            -m "chore(release): v$version [skip ci]" \
            -m "Release v$version published by the Release workflow (run ${{ github.run_id }})." \
            -m "🤖 Generated with Claude Code" \
            -m "Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>"

          git log -1 --pretty=%B

          if ! git push origin HEAD:main; then
            echo "::warning title=attribution-push::could not push the attribution commit to main (branch protection?), the release itself is unaffected"
            exit 0
          fi

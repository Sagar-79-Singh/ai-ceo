name: CI

# v1.0.3 is a .NET MAUI Blazor Hybrid desktop app. MAUI only builds for Windows here, so the
# pipeline is:
#   1. core + tests on Linux (fast, catches the guardrail/topology logic),
#   2. the real Windows desktop head built and packaged on windows-latest (the only OS that can
#      compile WinUI/MAUI), which also proves the MSIX installer can be produced.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  core:
    name: Core library + tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/AiCeo.Core/AiCeo.Core.csproj

      - name: Build core
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet build src/AiCeo.Core/AiCeo.Core.csproj -c Release --no-restore 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|error MSB" "$RUNNER_TEMP/build.log" | head -6 | tr '\n' '|')
            echo "::error title=build-failed::${MSG:0:1400}"
            exit 1
          fi

      - name: Unit tests (topology, guardrail, schema)
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet test tests/AiCeo.Tests/AiCeo.Tests.csproj -c Release --logger "console;verbosity=normal" 2>&1 | tee "$RUNNER_TEMP/test.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|\[FAIL\]|Error Message" "$RUNNER_TEMP/test.log" | head -8 | tr '\n' '|')
            DETAIL=$(grep -A 4 "Error Message:" "$RUNNER_TEMP/test.log" | head -24 | tr '\n' ' ' | tr -s ' ')
            echo "::error title=tests-failed::${MSG:0:900}"
            echo "::error title=test-detail::${DETAIL:0:1500}"
            exit 1
          fi
          tail -12 "$RUNNER_TEMP/test.log"

      - name: No-parallelism guard (strict sequential topology)
        shell: bash
        run: |
          set -euo pipefail
          # The product guarantee is one worker at a time; these patterns would break it.
          if grep -rnE "Task\.WhenAll|Parallel\.ForEachAsync|Task\.WhenAny" src/AiCeo.Core --include=*.cs; then
            echo "::error title=parallelism::the orchestrator must stay strictly sequential"
            exit 1
          fi

  desktop-windows:
    name: Windows desktop head (MAUI) + MSIX
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install the MAUI workload
        run: dotnet workload install maui-windows --skip-sign-check

      - name: Restore
        run: dotnet restore src/AiCeo.Maui/AiCeo.Maui.csproj -r win-x64

      - name: Build the desktop app
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "maui-build.log"
          dotnet build src/AiCeo.Maui/AiCeo.Maui.csproj -c Release -r win-x64 --no-restore 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $errors = (Select-String -Path $log -Pattern "error [A-Z]+[0-9]+|error MSB" | Select-Object -First 8 | ForEach-Object { $_.Line.Trim() }) -join " | "
            Write-Host "::error title=maui-build-failed::$($errors.Substring(0, [Math]::Min(1400, $errors.Length)))"
            exit 1
          }

      - name: Build the MSIX installer
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "msix.log"
          dotnet publish src/AiCeo.Maui/AiCeo.Maui.csproj -c Release -r win-x64 `
            -p:WindowsPackageType=MSIX `
            -p:AppxPackageSigningEnabled=false `
            -p:GenerateAppxPackageOnBuild=true `
            -o ./publish/msix 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $errors = (Select-String -Path $log -Pattern "error [A-Z]+[0-9]+|error MSB|error APPX" | Select-Object -First 8 | ForEach-Object { $_.Line.Trim() }) -join " | "
            Write-Host "::error title=msix-failed::$($errors.Substring(0, [Math]::Min(1400, $errors.Length)))"
            exit 1
          }

      - name: Verify the MSIX exists
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path ./publish/msix -Recurse -Filter *.msix -ErrorAction SilentlyContinue
          if (-not $packages) {
            $packages = Get-ChildItem -Path src/AiCeo.Maui -Recurse -Filter *.msix -ErrorAction SilentlyContinue
          }
          if (-not $packages) {
            Write-Host "::error title=missing-msix::the MSIX installer was not produced"
            Get-ChildItem -Path ./publish -Recurse | Select-Object FullName
            exit 1
          }
          $packages | ForEach-Object { Write-Host "built $($_.FullName) ($([Math]::Round($_.Length / 1MB, 1)) MB)" }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: msix-ci
          path: |
            publish/msix/**/*.msix
            src/AiCeo.Maui/**/*.msix
          if-no-files-found: error
          retention-days: 7

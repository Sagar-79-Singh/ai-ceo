name: CI

# Build check for every branch/PR. The smoke tests publish the single-file build, boot it, and
# verify the Blazor script + REST API are served — including when the binary is copied away from
# its publish folder (which is how the release ships: one lone AiCeo.exe).
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, publish and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show SDK info
        run: dotnet --info

      - name: Restore
        run: dotnet restore AiCeo.csproj

      - name: Build
        run: dotnet build AiCeo.csproj -c Release --no-restore

      - name: Publish (linux-x64, single file)
        run: dotnet publish AiCeo.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: Inspect publish output
        run: |
          ls -la ./publish
          echo "--- wwwroot ---"
          find ./publish/wwwroot -maxdepth 2 -type f 2>/dev/null | sort | head -20

      - name: Smoke test in place
        shell: bash
        run: |
          set -uo pipefail
          export AICEO_DB_PATH="$RUNNER_TEMP/aiceo.db"
          export ASPNETCORE_URLS="http://127.0.0.1:5088"

          ./publish/AiCeo > "$RUNNER_TEMP/app.log" 2>&1 &
          APP_PID=$!

          READY=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5088/ -o "$RUNNER_TEMP/page.html"; then
              READY=1
              break
            fi
            sleep 1
          done

          echo "--- app log ---"
          cat "$RUNNER_TEMP/app.log"

          if [ "$READY" -ne 1 ]; then
            echo "::error::The published app did not start listening on 5088"
            kill $APP_PID 2>/dev/null || true
            exit 1
          fi

          BLZ_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5088/_framework/blazor.web.js)
          AGENTS_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5088/api/agents)
          echo "blazor.web.js => $BLZ_CODE / api/agents => $AGENTS_CODE"
          curl -fsS http://127.0.0.1:5088/api/agents | head -c 320
          echo

          kill $APP_PID 2>/dev/null || true
          sleep 1

          if [ "$BLZ_CODE" != "200" ] || [ "$AGENTS_CODE" != "200" ]; then
            DIAG=$(curl -s --max-time 5 http://127.0.0.1:5088/api/diagnostics | head -c 700)
            LOG=$(tail -c 1200 "$RUNNER_TEMP/app.log" | tr '\n' '|')
            echo "::error title=static-assets::blazor=$BLZ_CODE agents=$AGENTS_CODE diag=$DIAG log=$LOG"
            exit 1
          fi

      - name: Standalone exe test (binary alone, foreign working directory)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/alone" "$RUNNER_TEMP/cwd" "$RUNNER_TEMP/data"
          cp ./publish/AiCeo "$RUNNER_TEMP/alone/AiCeo"
          export AICEO_DB_PATH="$RUNNER_TEMP/data/aiceo.db"
          export ASPNETCORE_URLS="http://127.0.0.1:5099"
          export AICEO_NO_BROWSER=1

          cd "$RUNNER_TEMP/cwd"
          "$RUNNER_TEMP/alone/AiCeo" > "$RUNNER_TEMP/alone.log" 2>&1 &
          APP_PID=$!

          READY=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5099/ -o "$RUNNER_TEMP/alone.html"; then
              READY=1
              break
            fi
            sleep 1
          done

          BLZ=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5099/_framework/blazor.web.js)
          AGENTS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5099/api/agents)
          echo "standalone: ready=$READY blazor=$BLZ agents=$AGENTS"
          echo "--- standalone log ---"
          cat "$RUNNER_TEMP/alone.log"

          kill $APP_PID 2>/dev/null || true
          sleep 1

          if [ "$READY" -ne 1 ] || [ "$BLZ" != "200" ] || [ "$AGENTS" != "200" ]; then
            DIAG=$(curl -s --max-time 5 http://127.0.0.1:5099/api/diagnostics | head -c 700)
            LOG=$(tail -c 1200 "$RUNNER_TEMP/alone.log" | tr '\n' '|')
            echo "::error title=standalone::ready=$READY blazor=$BLZ agents=$AGENTS diag=$DIAG log=$LOG"
            exit 1
          fi

  windows-publish:
    name: Windows publish check (release parity)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained single-file executable
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: Verify AiCeo.exe
        shell: pwsh
        run: |
          Get-ChildItem -Path ./publish | Select-Object Name, Length | Format-Table -AutoSize
          $exe = Join-Path $PWD "publish/AiCeo.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "AiCeo.exe was not produced by publish"
          }
          $sizeMb = [math]::Round((Get-Item -LiteralPath $exe).Length / 1MB, 2)
          Write-Host "AiCeo.exe size: $sizeMb MB"

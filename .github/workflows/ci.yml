name: CI

# v1.0.3 is a .NET MAUI Blazor Hybrid desktop app. MAUI only builds for Windows here, so the
# pipeline is:
#   1. core + tests on Linux (fast, catches the guardrail/topology logic),
#   2. the real Windows desktop head on windows-latest, published unpackaged and wrapped into an
#      Inno Setup installer (an MSIX is also attempted, but the .exe installer is the contract).
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  core:
    name: Core library + tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet restore src/AiCeo.Core/AiCeo.Core.csproj 2>&1 | tee "$RUNNER_TEMP/restore.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|NU[0-9]{4}" "$RUNNER_TEMP/restore.log" | head -8 | tr '\n' '|')
            echo "::error title=restore-failed::${MSG:0:1800}"
            exit 1
          fi

      - name: Build core
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet build src/AiCeo.Core/AiCeo.Core.csproj -c Release --no-restore 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|error MSB" "$RUNNER_TEMP/build.log" | head -6 | tr '\n' '|')
            echo "::error title=build-failed::${MSG:0:1400}"
            exit 1
          fi

      - name: Unit tests (topology, guardrail, schema)
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet test tests/AiCeo.Tests/AiCeo.Tests.csproj -c Release --logger "console;verbosity=normal" 2>&1 | tee "$RUNNER_TEMP/test.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|\[FAIL\]|Error Message" "$RUNNER_TEMP/test.log" | head -8 | tr '\n' '|')
            DETAIL=$(grep -A 4 "Error Message:" "$RUNNER_TEMP/test.log" | head -24 | tr '\n' ' ' | tr -s ' ')
            echo "::error title=tests-failed::${MSG:0:900}"
            echo "::error title=test-detail::${DETAIL:0:1500}"
            exit 1
          fi
          tail -12 "$RUNNER_TEMP/test.log"

      - name: No-parallelism guard (strict sequential topology)
        shell: bash
        run: |
          set -euo pipefail
          # The product guarantee is one worker at a time; these patterns would break it.
          if grep -rnE "Task\.WhenAll|Parallel\.ForEachAsync|Task\.WhenAny" src/AiCeo.Core --include=*.cs; then
            echo "::error title=parallelism::the orchestrator must stay strictly sequential"
            exit 1
          fi

  desktop-windows:
    name: Windows desktop head (MAUI) + installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install the MAUI workload
        run: dotnet workload install maui-windows --skip-sign-check

      - name: Restore
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "maui-restore.log"
          dotnet restore src/AiCeo.Maui/AiCeo.Maui.csproj -r win-x64 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $errors = (Select-String -Path $log -Pattern "error [A-Z]+[0-9]+|NU[0-9]{4}" | Select-Object -First 10 | ForEach-Object { $_.Line.Trim() }) -join " | "
            Write-Host "::error title=maui-restore-failed::$($errors.Substring(0, [Math]::Min(1800, $errors.Length)))"
            exit 1
          }

      - name: Build the desktop app
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "maui-build.log"
          dotnet build src/AiCeo.Maui/AiCeo.Maui.csproj -c Release -r win-x64 --no-restore 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $errors = (Select-String -Path $log -Pattern "error [A-Z]+[0-9]+|error MSB" | Select-Object -First 8 | ForEach-Object { $_.Line.Trim() }) -join " | "
            Write-Host "::error title=maui-build-failed::$($errors.Substring(0, [Math]::Min(1400, $errors.Length)))"
            exit 1
          }

      - name: Publish the unpackaged app
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "maui-publish.log"
          dotnet publish src/AiCeo.Maui/AiCeo.Maui.csproj -c Release -r win-x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -o ./artifacts/portable 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = ((Get-Content $log -Tail 50) -join " | ") -replace "\r?\n", " "
            Write-Host "::error title=publish-failed::exit=$code $($tail.Substring(0, [Math]::Min(2500, $tail.Length)))"
            exit 1
          }

      - name: Verify the app executable
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path ./artifacts/portable -Recurse -File -ErrorAction SilentlyContinue
          Write-Host "publish output: $($files.Count) files"
          Write-Host "top level: $((Get-ChildItem ./artifacts/portable | Select-Object -First 25 -ExpandProperty Name) -join ', ')"

          $exe = $files | Where-Object { $_.Extension -eq ".exe" -and $_.BaseName -like "AiCeo*" } | Select-Object -First 1
          if (-not $exe) {
            $exes = ($files | Where-Object { $_.Extension -eq ".exe" } | Select-Object -First 20 -ExpandProperty Name) -join ", "
            Write-Host "::error title=missing-exe::no AiCeo*.exe in the publish output (exes: $exes)"
            exit 1
          }
          Write-Host "app: $($exe.FullName) ($([Math]::Round($exe.Length / 1MB, 1)) MB)"

          # The installer script expects exactly this name.
          if ($exe.Name -ne "AiCeo.Maui.exe") {
            Copy-Item $exe.FullName (Join-Path $exe.Directory "AiCeo.Maui.exe") -Force
            Write-Host "normalised the app host name to AiCeo.Maui.exe"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the setup installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $iscc) {
            Write-Host "::error title=missing-iscc::Inno Setup's ISCC.exe was not found"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path ./artifacts/out | Out-Null

          $log = Join-Path $env:RUNNER_TEMP "inno.log"
          & $iscc "/DAppVersion=1.0.3" "/DSourceDir=$(Resolve-Path ./artifacts/portable)" "/DOutputDir=$(Resolve-Path ./artifacts/out)" ./installer/inno-setup/AiCeo.iss 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $tail = ((Get-Content $log -Tail 40) -join " | ") -replace "\r?\n", " "
            Write-Host "::error title=inno-failed::$($tail.Substring(0, [Math]::Min(2500, $tail.Length)))"
            exit 1
          }

      # Best effort: the WinUI-packaged MSIX is a bonus, the .exe installer above is the contract.
      - name: Try to build an MSIX (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet publish src/AiCeo.Maui/AiCeo.Maui.csproj -c Release -r win-x64 `
            -p:WindowsPackageType=MSIX `
            -p:WindowsAppSDKSelfContained=false `
            -p:AppxPackageSigningEnabled=false `
            -p:UapAppxPackageBuildMode=SideloadOnly
          $msix = Get-ChildItem -Path src/AiCeo.Maui -Recurse -Filter *.msix -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msix) {
            Copy-Item $msix.FullName "./artifacts/out/AI-CEO-Orchestrator-1.0.3-win-x64.msix" -Force
            Write-Host "msix: $($msix.FullName)"
          } else {
            Write-Host "no .msix produced; the Inno Setup installer is the release artifact"
          }

      - name: Verify the installer exists
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path ./artifacts/out -Filter "*setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) {
            Write-Host "::error title=missing-installer::no setup .exe was produced"
            Get-ChildItem ./artifacts -Recurse | Select-Object FullName
            exit 1
          }
          Write-Host "installer: $($setup.Name) ($([Math]::Round($setup.Length / 1MB, 1)) MB)"
          Get-ChildItem ./artifacts/out | Select-Object Name, Length

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: artifacts/out/*
          if-no-files-found: error
          retention-days: 7

name: CI

# v1.0.16 is a PhotinoX desktop app: a native window hosting the operating system's own WebView
# (WebView2 on Windows, WKWebView on macOS, WebKitGTK 4.1 on Linux), so the pipeline does:
#   1. the core library + unit tests on Linux (guardrail, topology, tools, schema, LLM connection),
#   2. the desktop head built and published as a single file on Linux (real executable, booted
#      headlessly through --self-test, plus the --smoke-ui run on Xvfb: the native window, the
#      WebKitGTK web view, the page→host "ready" handshake, a settings command round-trip, and the
#      v1.0.16 first-run connection flow — no connection ⇒ setup required, saveConnection ⇒
#      configured, an invalid submission ⇒ rejected),
#   3. the same on Windows, producing the standalone .exe users download, and compiling
#      installer.iss for x64 / x86 / arm64 with Inno Setup so every installer script is validated on every push.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  core:
    name: Core library + tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet restore tests/AiCeo.Tests/AiCeo.Tests.csproj 2>&1 | tee "$RUNNER_TEMP/restore.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|NU[0-9]{4}" "$RUNNER_TEMP/restore.log" | head -8 | tr '\n' '|')
            echo "::error title=restore-failed::${MSG:0:1800}"
            exit 1
          fi

      - name: Build core
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet build src/AiCeo.Core/AiCeo.Core.csproj -c Release --no-restore 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|error MSB" "$RUNNER_TEMP/build.log" | head -6 | tr '\n' '|')
            echo "::error title=build-failed::${MSG:0:1400}"
            exit 1
          fi

      - name: Unit tests (topology, guardrail, schema)
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet test tests/AiCeo.Tests/AiCeo.Tests.csproj -c Release --logger "console;verbosity=normal" 2>&1 | tee "$RUNNER_TEMP/test.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|\[FAIL\]|Error Message" "$RUNNER_TEMP/test.log" | head -8 | tr '\n' '|')
            DETAIL=$(grep -A 4 "Error Message:" "$RUNNER_TEMP/test.log" | head -24 | tr '\n' ' ' | tr -s ' ')
            echo "::error title=tests-failed::${MSG:0:900}"
            echo "::error title=test-detail::${DETAIL:0:1500}"
            exit 1
          fi
          tail -12 "$RUNNER_TEMP/test.log"

      - name: Release notes template guard
        shell: bash
        run: |
          set -euo pipefail
          # v1.0.16 shipped notes that read "AiCeo-win-x64-v${PRODUCT_VERSION}.exe": the release body
          # is a GitHub Actions template, not a shell script, so a shell-style placeholder is copied
          # into the published release verbatim. Only the version placeholder is checked here — the
          # packaging steps legitimately use shell variables.
          if grep -n '${PRODUCT_VERSION}' .github/workflows/release.yml; then
            echo "::error title=release-body-placeholder::release.yml uses a shell-style version placeholder where a GitHub expression is required"
            exit 1
          fi

      - name: No-parallelism guard (strict sequential topology)
        shell: bash
        run: |
          set -euo pipefail
          # The product guarantee is one worker at a time; these patterns would break it.
          if grep -rnE "Task\.WhenAll|Parallel\.ForEachAsync|Task\.WhenAny" src/AiCeo.Core --include=*.cs; then
            echo "::error title=parallelism::the orchestrator must stay strictly sequential"
            exit 1
          fi

  desktop-linux:
    name: Desktop (Linux x64, single file)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/AiCeo.Desktop/AiCeo.Desktop.csproj -r linux-x64

      - name: Install the WebKitGTK runtime and a virtual display
        shell: bash
        run: |
          set -euo pipefail
          # PhotinoX draws with the system WebView: WebKitGTK 4.1 (the .deb depends on the same
          # package). Xvfb provides the display the smoke test needs.
          sudo apt-get update -qq
          # libnotify4 is a shared-library dependency of PhotinoX.Native on Linux (application
          # notifications); without it the native bridge cannot be loaded at all.
          sudo apt-get install -y -qq libwebkit2gtk-4.1-0 libgtk-3-0 libnotify4 xvfb libgl1-mesa-dri fonts-dejavu-core
          dpkg -l | grep -E "libwebkit2gtk-4.1-0|libgtk-3-0|libnotify4" || true

      - name: Publish (single file, self-contained)
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet publish src/AiCeo.Desktop/AiCeo.Desktop.csproj \
                -c Release -r linux-x64 --self-contained true \
                -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
                -p:DebugType=none -p:DebugSymbols=false 2>&1 | tee "$RUNNER_TEMP/publish.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|error MSB|error NU" "$RUNNER_TEMP/publish.log" | head -8 | tr '\n' '|')
            echo "::error title=publish-failed::${MSG:0:1800}"
            exit 1
          fi

      - name: Verify it is a single file
        shell: bash
        run: |
          set -euo pipefail
          ROOT="src/AiCeo.Desktop/bin/Release/net10.0/linux-x64/publish"
          ls -la "$ROOT"

          if [ ! -f "$ROOT/AiCeo" ]; then
            echo "::error title=missing-binary::the publish output has no AiCeo executable"
            exit 1
          fi

          COUNT=$(find "$ROOT" -maxdepth 1 -type f | wc -l)
          echo "top-level files: $COUNT"
          if [ "$COUNT" -gt 2 ]; then
            echo "::error title=not-single-file::the publish output has more than the executable (and maybe a log)"
            exit 1
          fi

      - name: Run the published binary (--self-test)
        shell: bash
        run: |
          set +e
          ROOT="src/AiCeo.Desktop/bin/Release/net10.0/linux-x64/publish"
          export AICEO_DB_PATH="$RUNNER_TEMP/smoke/aiceo.db"
          mkdir -p "$RUNNER_TEMP/smoke"

          "$ROOT/AiCeo" --self-test 2>&1 | tee "$RUNNER_TEMP/selftest.log"
          CODE=${PIPESTATUS[0]}
          echo "exit code: $CODE"

          if [ "$CODE" -ne 0 ]; then
            echo "::error title=selftest-failed::the single-file binary did not start"
            [ -f "$ROOT/crash.log" ] && tail -40 "$ROOT/crash.log"
            exit 1
          fi

          if ! grep -q "SELF-TEST OK" "$RUNNER_TEMP/selftest.log"; then
            echo "::error title=selftest-report::SELF-TEST OK was not reported"
            exit 1
          fi

          echo "ui smoke test (native window + WebKitGTK on a headless X server)"
          # Software rendering: the runner has no GPU, and WebKitGTK would otherwise fail to
          # composite its web view inside Xvfb.
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export LIBGL_ALWAYS_SOFTWARE=1
          export GDK_BACKEND=x11
          export NO_AT_BRIDGE=1
          export LANG=C.UTF-8
          # WebKit's bubblewrap sandbox cannot start inside a container where unprivileged user
          # namespaces are restricted (Ubuntu 23.10+ with AppArmor); the smoke run only renders our
          # own local page, so the sandbox is disabled for it.
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export WEBKIT_FORCE_SANDBOX=0

          timeout 180 xvfb-run -a "$ROOT/AiCeo" --smoke-ui 2>&1 | tee "$RUNNER_TEMP/uismoke.log"
          UI_CODE=${PIPESTATUS[0]}

          echo "ui smoke exit code: $UI_CODE"
          if [ "$UI_CODE" -ne 0 ]; then
            # Surface the reason in the check annotations: the raw log lives on blob storage.
            DETAIL=$(tail -c 3000 "$RUNNER_TEMP/uismoke.log" | tr '\n' '|' | tr -d '\r')
            echo "::error title=ui-smoke-failed::exit $UI_CODE :: ${DETAIL:0:3400}"
            if [ -f "$ROOT/crash.log" ]; then
              CRASH=$(tail -c 2000 "$ROOT/crash.log" | tr '\n' '|' | tr -d '\r')
              echo "::error title=ui-smoke-crash::${CRASH:0:3400}"
            fi
            exit 1
          fi
          if ! grep -q "UI SMOKE OK" "$RUNNER_TEMP/uismoke.log"; then
            DETAIL=$(tail -c 3000 "$RUNNER_TEMP/uismoke.log" | tr '\n' '|' | tr -d '\r')
            echo "::error title=ui-smoke-report::UI SMOKE OK was not reported :: ${DETAIL:0:3400}"
            exit 1
          fi
          # The page must have talked to the host and a command must have travelled back.
          if ! grep -q "page bridge ready = True" "$RUNNER_TEMP/uismoke.log"; then
            echo "::error title=bridge-failed::the Nexus page never reached the host over the native web-message bridge"
            tail -40 "$RUNNER_TEMP/uismoke.log"
            exit 1
          fi
          if ! grep -q "settings round-trip = True" "$RUNNER_TEMP/uismoke.log"; then
            echo "::error title=command-failed::a page command did not reach the host snapshot"
            tail -40 "$RUNNER_TEMP/uismoke.log"
            exit 1
          fi
          # v1.0.16: a fresh database must report "setup required", the setup sheet's command must
          # persist a connection, and an invalid submission must be rejected without side effects.
          if ! grep -q "first-run setup required = True" "$RUNNER_TEMP/uismoke.log"; then
            echo "::error title=setup-required::a fresh install did not report that the first-run setup is required"
            tail -40 "$RUNNER_TEMP/uismoke.log"
            exit 1
          fi
          if ! grep -q "connection round-trip = True" "$RUNNER_TEMP/uismoke.log"; then
            echo "::error title=connection-failed::saveConnection did not persist the LLM connection"
            tail -40 "$RUNNER_TEMP/uismoke.log"
            exit 1
          fi
          if ! grep -q "invalid setup rejected = True" "$RUNNER_TEMP/uismoke.log"; then
            echo "::error title=connection-validation::an incomplete connection was accepted"
            tail -40 "$RUNNER_TEMP/uismoke.log"
            exit 1
          fi
          # v2.0.0: spaces must be created, listed, published and able to restore a conversation,
          # and the approval gate must park a tool call until it is answered.
          if ! grep -q "spaces round-trip = True" "$RUNNER_TEMP/uismoke.log"; then
            echo "::error title=spaces-failed::creating a space did not persist or publish it"
            tail -40 "$RUNNER_TEMP/uismoke.log"
            exit 1
          fi
          if ! grep -q "conversation restore = True" "$RUNNER_TEMP/uismoke.log"; then
            echo "::error title=space-conversation::the space did not restore its conversation"
            tail -40 "$RUNNER_TEMP/uismoke.log"
            exit 1
          fi
          if ! grep -q "approval round-trip = True" "$RUNNER_TEMP/uismoke.log"; then
            echo "::error title=approval-failed::the approval gate did not park and resolve a tool call"
            tail -40 "$RUNNER_TEMP/uismoke.log"
            exit 1
          fi
          # v2.0.1: the transcript must be a conversation (a user bubble and a CEO bubble), and a
          # delegation must produce a readable CEO ↔ worker thread.
          if ! grep -q "chat surface = True" "$RUNNER_TEMP/uismoke.log"; then
            echo "::error title=chat-surface::the transcript is not rendering user and CEO bubbles"
            tail -40 "$RUNNER_TEMP/uismoke.log"
            exit 1
          fi
          if ! grep -q "worker thread round-trip = True" "$RUNNER_TEMP/uismoke.log"; then
            echo "::error title=worker-thread::a delegation did not produce a readable worker conversation"
            tail -40 "$RUNNER_TEMP/uismoke.log"
            exit 1
          fi
          # v2.0.2: the worker chat must be its own routed view, not an overlay on the CEO chat.
          if ! grep -q "single chat view = True" "$RUNNER_TEMP/uismoke.log"; then
            echo "::error title=chat-routing::the worker chat is not routed as a separate view"
            tail -40 "$RUNNER_TEMP/uismoke.log"
            exit 1
          fi

          # Crash logging: with no display server the native window cannot be created. The binary
          # must exit non-zero AND leave a crash.log with the stack trace next to itself (the app
          # checks DISPLAY/WAYLAND_DISPLAY itself, so this is deterministic on every runner).
          echo "crash-log check (no display)"
          rm -f "$ROOT/crash.log"
          env -u DISPLAY -u WAYLAND_DISPLAY AICEO_DB_PATH="$AICEO_DB_PATH" timeout 60 "$ROOT/AiCeo" > "$RUNNER_TEMP/nodisplay.log" 2>&1
          CRASH_CODE=$?
          echo "exit code without a display: $CRASH_CODE"

          if [ "$CRASH_CODE" -eq 0 ]; then
            echo "::error title=crash-exit::the app exited 0 even though no display was available"
            exit 1
          fi

          if [ ! -f "$ROOT/crash.log" ]; then
            echo "::error title=no-crash-log::crash.log was not written next to the executable"
            tail -20 "$RUNNER_TEMP/nodisplay.log"
            exit 1
          fi

          echo "--- crash.log ---"
          head -30 "$ROOT/crash.log"

          if ! grep -q "crash report" "$ROOT/crash.log" || ! grep -q "context  : Startup" "$ROOT/crash.log"; then
            echo "::error title=bad-crash-log::crash.log is missing the startup report header"
            exit 1
          fi
          if ! grep -qE "at AiCeo|at Photino|X11|display|Exception" "$ROOT/crash.log"; then
            echo "::error title=no-stack::crash.log has no stack trace"
            exit 1
          fi
          echo "crash.log contains the full startup stack trace"

          # The app must have created its database somewhere writable.
          if [ ! -f "$AICEO_DB_PATH" ]; then
            export AICEO_DB_PATH="$HOME/.local/share/AiCeoOrchestrator/aiceo.db"
          fi
          echo "database: $(ls -la "$(dirname "$AICEO_DB_PATH")" | head -5)"

  desktop-windows:
    name: Desktop (Windows x64, standalone .exe)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/AiCeo.Desktop/AiCeo.Desktop.csproj -r win-x64

      - name: Publish (single file, self-contained)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "publish.log"
          dotnet publish src/AiCeo.Desktop/AiCeo.Desktop.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none -p:DebugSymbols=false 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $errors = (Select-String -Path $log -Pattern "error [A-Z]+[0-9]+|error MSB|error NU" | Select-Object -First 8 | ForEach-Object { $_.Line.Trim() }) -join " | "
            Write-Host "::error title=publish-failed::$($errors.Substring(0, [Math]::Min(1800, $errors.Length)))"
            exit 1
          }

      - name: Verify the single .exe
        shell: pwsh
        run: |
          $root = "src/AiCeo.Desktop/bin/Release/net10.0/win-x64/publish"
          Get-ChildItem $root | Select-Object Name, Length

          $exe = Join-Path $root "AiCeo.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error title=missing-exe::the publish output has no AiCeo.exe"
            exit 1
          }

          $files = Get-ChildItem $root -File
          if ($files.Count -gt 2) {
            Write-Host "::error title=not-single-file::expected one .exe, found $($files.Count) files"
            exit 1
          }

          $sizeMb = [Math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "standalone executable: AiCeo.exe ($sizeMb MB)"

          if ((Get-Item $exe).Length -lt 1MB) {
            Write-Host "::error title=tiny-exe::the executable is too small to be self-contained"
            exit 1
          }

      - name: Run the published exe (--self-test)
        shell: pwsh
        run: |
          $root = "src/AiCeo.Desktop/bin/Release/net10.0/win-x64/publish"
          $env:AICEO_DB_PATH = Join-Path $env:RUNNER_TEMP "smoke/aiceo.db"
          New-Item -ItemType Directory -Force -Path (Split-Path $env:AICEO_DB_PATH) | Out-Null

          $log = Join-Path $env:RUNNER_TEMP "selftest.log"
          & (Join-Path $root "AiCeo.exe") --self-test *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Write-Host "self-test exit code: $code"

          if ($code -ne 0) {
            $crash = Join-Path $root "crash.log"
            if (Test-Path $crash) { Get-Content $crash -Tail 40 }
            Write-Host "::error title=selftest-failed::the standalone .exe did not start"
            exit 1
          }

          if (-not (Select-String -Path $log -Pattern "SELF-TEST OK" -Quiet)) {
            $fallback = Join-Path $root "self-test.log"
            if (-not ((Test-Path $fallback) -and (Select-String -Path $fallback -Pattern "SELF-TEST OK" -Quiet))) {
              Write-Host "::error title=selftest-report::SELF-TEST OK was not reported"
              exit 1
            }
          }

      - name: Compile the Inno Setup installers (all three architectures)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "::error title=no-inno-setup::Chocolatey did not install Inno Setup"
            exit 1
          }
          Write-Host "ISCC: $iscc"

          # v1.0.16: every artefact carries the version, exactly as release.yml names it.
          $version = (Select-String -Path "src/AiCeo.Desktop/AiCeo.Desktop.csproj" -Pattern "<Version>([^<]+)</Version>").Matches[0].Groups[1].Value
          Write-Host "version: $version"

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item "src/AiCeo.Desktop/bin/Release/net10.0/win-x64/publish/AiCeo.exe" "dist/AiCeo-win-x64-v$version.exe" -Force

          # The installer embeds the WebView2 Evergreen bootstrapper when it is present. Fetch it so
          # the [Files]/[Code] branches for the bundled prerequisite are exercised on every push.
          $bootstrapper = Join-Path "dist" "MicrosoftEdgeWebView2Setup.exe"
          try {
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $bootstrapper -UseBasicParsing -TimeoutSec 120
            Write-Host "WebView2 bootstrapper: $((Get-Item $bootstrapper).Length) bytes"
          } catch {
            Write-Host "::warning title=webview2-bootstrapper::not downloaded; compiling the installer without the bundled runtime"
          }

          # Stubs for the cross-architecture installers: this runner is x64, but the preprocessor
          # branches (ArchitecturesAllowed / ArchitecturesInstallIn64BitMode) and Inno Setup's
          # ARM64 support still have to compile, so every installer architecture is validated.
          foreach ($arch in @("x86", "arm64")) {
            $stub = Join-Path "dist" "AiCeo-win-$arch-v$version.exe"
            [System.IO.File]::WriteAllBytes($stub, [byte[]](0x4D, 0x5A) + (New-Object byte[] 2048))
          }

          foreach ($arch in @("x64", "x86", "arm64")) {
            Write-Host "compiling Setup-win-$arch-v$version.exe"
            $log = Join-Path $env:RUNNER_TEMP "iscc-$arch.log"
            & $iscc "/DAppVersion=$version" "/DAppArch=$arch" "/DAppSourceExe=dist\AiCeo-win-$arch-v$version.exe" "installer.iss" 2>&1 |
              Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) {
              $errors = (Select-String -Path $log -Pattern "Error|error" | Select-Object -First 6 |
                ForEach-Object { $_.Line.Trim() }) -join " | "
              Write-Host "::error title=iscc-failed::Setup-win-$arch-v$version.exe failed: $($errors.Substring(0, [Math]::Min(1600, $errors.Length)))"
              exit 1
            }
          }

          Get-ChildItem "dist/installer" | Select-Object Name, Length

          foreach ($arch in @("x64", "x86", "arm64")) {
            $setup = "dist/installer/Setup-win-$arch-v$version.exe"
            if (-not (Test-Path $setup)) {
              Write-Host "::error title=missing-installer::$setup was not produced"
              exit 1
            }
          }

          # The x64 installer wraps the real application; the other two only carry stubs.
          $real = "dist/installer/Setup-win-x64-v$version.exe"
          $sizeMb = [Math]::Round((Get-Item $real).Length / 1MB, 1)
          Write-Host "installer compiled: Setup-win-x64-v$version.exe ($sizeMb MB)"
          if ((Get-Item $real).Length -lt 5MB) {
            Write-Host "::error title=small-installer::the installer does not contain the application"
            exit 1
          }

      - name: Upload the standalone exe
        uses: actions/upload-artifact@v4
        with:
          name: AiCeo-win-x64.exe
          path: src/AiCeo.Desktop/bin/Release/net10.0/win-x64/publish/AiCeo.exe
          if-no-files-found: error
          retention-days: 7

name: CI

# v1.0.6 is a cross-platform Avalonia desktop app whose UI is an embedded HTML surface, so the
# pipeline does:
#   1. the core library + unit tests on Linux (guardrail, topology, tools, schema, theme tokens),
#   2. the desktop head built and published as a single file on Linux (real executable, booted
#      headlessly through --self-test, plus the --smoke-ui window, settings panel and bundled Nexus
#      page/stylesheet extraction on Xvfb),
#   3. the same on Windows, producing the standalone .exe users download, and compiling
#      installer.iss with Inno Setup so the installer script is validated on every push.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  core:
    name: Core library + tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet restore tests/AiCeo.Tests/AiCeo.Tests.csproj 2>&1 | tee "$RUNNER_TEMP/restore.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|NU[0-9]{4}" "$RUNNER_TEMP/restore.log" | head -8 | tr '\n' '|')
            echo "::error title=restore-failed::${MSG:0:1800}"
            exit 1
          fi

      - name: Build core
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet build src/AiCeo.Core/AiCeo.Core.csproj -c Release --no-restore 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|error MSB" "$RUNNER_TEMP/build.log" | head -6 | tr '\n' '|')
            echo "::error title=build-failed::${MSG:0:1400}"
            exit 1
          fi

      - name: Unit tests (topology, guardrail, schema)
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet test tests/AiCeo.Tests/AiCeo.Tests.csproj -c Release --logger "console;verbosity=normal" 2>&1 | tee "$RUNNER_TEMP/test.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|\[FAIL\]|Error Message" "$RUNNER_TEMP/test.log" | head -8 | tr '\n' '|')
            DETAIL=$(grep -A 4 "Error Message:" "$RUNNER_TEMP/test.log" | head -24 | tr '\n' ' ' | tr -s ' ')
            echo "::error title=tests-failed::${MSG:0:900}"
            echo "::error title=test-detail::${DETAIL:0:1500}"
            exit 1
          fi
          tail -12 "$RUNNER_TEMP/test.log"

      - name: No-parallelism guard (strict sequential topology)
        shell: bash
        run: |
          set -euo pipefail
          # The product guarantee is one worker at a time; these patterns would break it.
          if grep -rnE "Task\.WhenAll|Parallel\.ForEachAsync|Task\.WhenAny" src/AiCeo.Core --include=*.cs; then
            echo "::error title=parallelism::the orchestrator must stay strictly sequential"
            exit 1
          fi

  desktop-linux:
    name: Desktop (Linux x64, single file)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/AiCeo.Desktop/AiCeo.Desktop.csproj -r linux-x64

      - name: Publish (single file, self-contained)
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet publish src/AiCeo.Desktop/AiCeo.Desktop.csproj \
                -c Release -r linux-x64 --self-contained true \
                -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
                -p:DebugType=none -p:DebugSymbols=false 2>&1 | tee "$RUNNER_TEMP/publish.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|error MSB|error NU" "$RUNNER_TEMP/publish.log" | head -8 | tr '\n' '|')
            echo "::error title=publish-failed::${MSG:0:1800}"
            exit 1
          fi

      - name: Verify it is a single file
        shell: bash
        run: |
          set -euo pipefail
          ROOT="src/AiCeo.Desktop/bin/Release/net10.0/linux-x64/publish"
          ls -la "$ROOT"

          if [ ! -f "$ROOT/AiCeo" ]; then
            echo "::error title=missing-binary::the publish output has no AiCeo executable"
            exit 1
          fi

          COUNT=$(find "$ROOT" -maxdepth 1 -type f | wc -l)
          echo "top-level files: $COUNT"
          if [ "$COUNT" -gt 2 ]; then
            echo "::error title=not-single-file::the publish output has more than the executable (and maybe a log)"
            exit 1
          fi

      - name: Run the published binary (--self-test)
        shell: bash
        run: |
          set +e
          ROOT="src/AiCeo.Desktop/bin/Release/net10.0/linux-x64/publish"
          export AICEO_DB_PATH="$RUNNER_TEMP/smoke/aiceo.db"
          mkdir -p "$RUNNER_TEMP/smoke"

          "$ROOT/AiCeo" --self-test 2>&1 | tee "$RUNNER_TEMP/selftest.log"
          CODE=${PIPESTATUS[0]}
          echo "exit code: $CODE"

          if [ "$CODE" -ne 0 ]; then
            echo "::error title=selftest-failed::the single-file binary did not start"
            [ -f "$ROOT/crash.log" ] && tail -40 "$ROOT/crash.log"
            exit 1
          fi

          if ! grep -q "SELF-TEST OK" "$RUNNER_TEMP/selftest.log"; then
            echo "::error title=selftest-report::SELF-TEST OK was not reported"
            exit 1
          fi

          echo "ui smoke test (headless X server)"
          if command -v xvfb-run > /dev/null 2>&1; then
            xvfb-run -a "$ROOT/AiCeo" --smoke-ui 2>&1 | tee "$RUNNER_TEMP/uismoke.log"
            UI_CODE=${PIPESTATUS[0]}
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            xvfb-run -a "$ROOT/AiCeo" --smoke-ui 2>&1 | tee "$RUNNER_TEMP/uismoke.log"
            UI_CODE=${PIPESTATUS[0]}
          fi

          echo "ui smoke exit code: $UI_CODE"
          if [ "$UI_CODE" -ne 0 ]; then
            echo "::error title=ui-smoke-failed::the Avalonia window could not be created"
            [ -f "$ROOT/crash.log" ] && tail -60 "$ROOT/crash.log"
            exit 1
          fi
          if ! grep -q "UI SMOKE OK" "$RUNNER_TEMP/uismoke.log"; then
            echo "::error title=ui-smoke-report::UI SMOKE OK was not reported"
            exit 1
          fi

          # Crash logging: with no display, Avalonia cannot start. The binary must exit non-zero
          # AND leave a crash.log with the stack trace next to itself.
          echo "crash-log check (no display)"
          rm -f "$ROOT/crash.log"
          env -u DISPLAY -u WAYLAND_DISPLAY AICEO_DB_PATH="$AICEO_DB_PATH" "$ROOT/AiCeo" > "$RUNNER_TEMP/nodisplay.log" 2>&1
          CRASH_CODE=$?
          echo "exit code without a display: $CRASH_CODE"

          if [ "$CRASH_CODE" -eq 0 ]; then
            echo "::error title=crash-exit::the app exited 0 even though no display was available"
            exit 1
          fi

          if [ ! -f "$ROOT/crash.log" ]; then
            echo "::error title=no-crash-log::crash.log was not written next to the executable"
            tail -20 "$RUNNER_TEMP/nodisplay.log"
            exit 1
          fi

          echo "--- crash.log ---"
          head -30 "$ROOT/crash.log"

          if ! grep -q "crash report" "$ROOT/crash.log" || ! grep -q "context  : Startup" "$ROOT/crash.log"; then
            echo "::error title=bad-crash-log::crash.log is missing the startup report header"
            exit 1
          fi
          if ! grep -qE "at Avalonia|X11|display|Exception" "$ROOT/crash.log"; then
            echo "::error title=no-stack::crash.log has no stack trace"
            exit 1
          fi
          echo "crash.log contains the full startup stack trace"

          # The app must have created its database somewhere writable.
          if [ ! -f "$AICEO_DB_PATH" ]; then
            export AICEO_DB_PATH="$HOME/.local/share/AiCeoOrchestrator/aiceo.db"
          fi
          echo "database: $(ls -la "$(dirname "$AICEO_DB_PATH")" | head -5)"

  desktop-windows:
    name: Desktop (Windows x64, standalone .exe)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/AiCeo.Desktop/AiCeo.Desktop.csproj -r win-x64

      - name: Publish (single file, self-contained)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "publish.log"
          dotnet publish src/AiCeo.Desktop/AiCeo.Desktop.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none -p:DebugSymbols=false 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $errors = (Select-String -Path $log -Pattern "error [A-Z]+[0-9]+|error MSB|error NU" | Select-Object -First 8 | ForEach-Object { $_.Line.Trim() }) -join " | "
            Write-Host "::error title=publish-failed::$($errors.Substring(0, [Math]::Min(1800, $errors.Length)))"
            exit 1
          }

      - name: Verify the single .exe
        shell: pwsh
        run: |
          $root = "src/AiCeo.Desktop/bin/Release/net10.0/win-x64/publish"
          Get-ChildItem $root | Select-Object Name, Length

          $exe = Join-Path $root "AiCeo.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error title=missing-exe::the publish output has no AiCeo.exe"
            exit 1
          }

          $files = Get-ChildItem $root -File
          if ($files.Count -gt 2) {
            Write-Host "::error title=not-single-file::expected one .exe, found $($files.Count) files"
            exit 1
          }

          $sizeMb = [Math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "standalone executable: AiCeo.exe ($sizeMb MB)"

          if ((Get-Item $exe).Length -lt 1MB) {
            Write-Host "::error title=tiny-exe::the executable is too small to be self-contained"
            exit 1
          }

      - name: Run the published exe (--self-test)
        shell: pwsh
        run: |
          $root = "src/AiCeo.Desktop/bin/Release/net10.0/win-x64/publish"
          $env:AICEO_DB_PATH = Join-Path $env:RUNNER_TEMP "smoke/aiceo.db"
          New-Item -ItemType Directory -Force -Path (Split-Path $env:AICEO_DB_PATH) | Out-Null

          $log = Join-Path $env:RUNNER_TEMP "selftest.log"
          & (Join-Path $root "AiCeo.exe") --self-test *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Write-Host "self-test exit code: $code"

          if ($code -ne 0) {
            $crash = Join-Path $root "crash.log"
            if (Test-Path $crash) { Get-Content $crash -Tail 40 }
            Write-Host "::error title=selftest-failed::the standalone .exe did not start"
            exit 1
          }

          if (-not (Select-String -Path $log -Pattern "SELF-TEST OK" -Quiet)) {
            $fallback = Join-Path $root "self-test.log"
            if (-not ((Test-Path $fallback) -and (Select-String -Path $fallback -Pattern "SELF-TEST OK" -Quiet))) {
              Write-Host "::error title=selftest-report::SELF-TEST OK was not reported"
              exit 1
            }
          }

      - name: Compile the Inno Setup installer (validation)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "::error title=no-inno-setup::Chocolatey did not install Inno Setup"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item "src/AiCeo.Desktop/bin/Release/net10.0/win-x64/publish/AiCeo.exe" "dist/AiCeo-win-x64.exe" -Force

          $log = Join-Path $env:RUNNER_TEMP "iscc.log"
          & $iscc "installer.iss" 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $errors = (Select-String -Path $log -Pattern "Error|error" | Select-Object -First 6 |
              ForEach-Object { $_.Line.Trim() }) -join " | "
            Write-Host "::error title=iscc-failed::$($errors.Substring(0, [Math]::Min(1800, $errors.Length)))"
            exit 1
          }

          $setup = Get-ChildItem "dist/installer/*-Setup.exe" | Select-Object -First 1
          if (-not $setup) {
            Write-Host "::error title=missing-installer::installer.iss produced no Setup.exe"
            exit 1
          }
          $sizeMb = [Math]::Round($setup.Length / 1MB, 1)
          Write-Host "installer compiled: $($setup.Name) ($sizeMb MB)"
          if ($setup.Length -lt 5MB) {
            Write-Host "::error title=small-installer::the installer does not contain the application"
            exit 1
          }

      - name: Upload the standalone exe
        uses: actions/upload-artifact@v4
        with:
          name: AiCeo-win-x64.exe
          path: src/AiCeo.Desktop/bin/Release/net10.0/win-x64/publish/AiCeo.exe
          if-no-files-found: error
          retention-days: 7

name: CI

# Every branch/PR: unit tests, a single-file publish that is actually booted (twice — in place
# and with the binary copied alone somewhere else), a v1.0.x → v1.0.2 database upgrade check, and
# a publish dry-run for every RID the release workflow ships.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    name: Build, test, smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore AiCeo.csproj

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet build AiCeo.csproj -c Release --no-restore 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|error MSB" "$RUNNER_TEMP/build.log" | head -6 | tr '\n' '|')
            echo "::error title=build-failed::${MSG:0:1400}"
            exit 1
          fi

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet test tests/AiCeo.Tests/AiCeo.Tests.csproj -c Release --logger "console;verbosity=normal" 2>&1 | tee "$RUNNER_TEMP/test.log"; then
            MSG=$(grep -E "error [A-Z]+[0-9]+|\[FAIL\]|Error Message" "$RUNNER_TEMP/test.log" | head -8 | tr '\n' '|')
            DETAIL=$(grep -A 4 "Error Message:" "$RUNNER_TEMP/test.log" | head -24 | tr '\n' ' ' | tr -s ' ')
            echo "::error title=tests-failed::${MSG:0:900}"
            echo "::error title=test-detail::${DETAIL:0:1500}"
            exit 1
          fi
          tail -12 "$RUNNER_TEMP/test.log"

      - name: Publish (linux-x64, single file)
        run: dotnet publish AiCeo.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: Smoke test in place
        shell: bash
        run: |
          set +e
          export AICEO_DB_PATH="$RUNNER_TEMP/aiceo.db"
          export ASPNETCORE_URLS="http://127.0.0.1:5088"
          export AICEO_NO_BROWSER=1

          ./publish/AiCeo > "$RUNNER_TEMP/app.log" 2>&1 &
          APP_PID=$!

          READY=0
          for i in $(seq 1 45); do
            curl -fsS --max-time 3 http://127.0.0.1:5088/ -o "$RUNNER_TEMP/page.html" && READY=1 && break
            kill -0 $APP_PID 2>/dev/null || break
            sleep 1
          done

          BLZ=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:5088/_framework/blazor.web.js)
          AGENTS=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:5088/api/agents)
          PROVIDERS=$(curl -s --max-time 5 http://127.0.0.1:5088/api/providers)
          SEEDED=$(curl -s --max-time 5 http://127.0.0.1:5088/api/agents)
          DIAG=$(curl -s --max-time 5 http://127.0.0.1:5088/api/diagnostics | head -c 900)
          LOG=$(tail -c 1600 "$RUNNER_TEMP/app.log" | tr '\n' '|')

          echo "ready=$READY blazor=$BLZ agents=$AGENTS"
          echo "providers: $PROVIDERS"

          kill $APP_PID 2>/dev/null
          sleep 1

          if [ "$READY" -ne 1 ] || [ "$BLZ" != "200" ] || [ "$AGENTS" != "200" ]; then
            echo "::error title=smoke-failed::ready=$READY blazor=$BLZ agents=$AGENTS diag=$DIAG log=$LOG"
            exit 1
          fi

          for provider in OmniRoute OpenAI Gemini Custom; do
            if ! printf '%s' "$PROVIDERS" | grep -q "\"provider\":\"$provider\""; then
              echo "::error title=providers-missing::/api/providers did not list $provider"
              exit 1
            fi
          done

          # Seeded agents must expose the provider fields but never a key.
          if ! printf '%s' "$SEEDED" | grep -q '"providerDisplayName":"OmniRoute"'; then
            echo "::error title=seed-shape::seeded agents did not report OmniRoute"
            exit 1
          fi
          if printf '%s' "$SEEDED" | grep -q 'sk-48f9a7b2051199e0'; then
            echo "::error title=key-leak::/api/agents leaked an API key"
            exit 1
          fi

      - name: Standalone exe test (binary alone, foreign working directory)
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/alone" "$RUNNER_TEMP/cwd" "$RUNNER_TEMP/data"
          cp ./publish/AiCeo "$RUNNER_TEMP/alone/AiCeo"
          export AICEO_DB_PATH="$RUNNER_TEMP/data/aiceo.db"
          export ASPNETCORE_URLS="http://127.0.0.1:5099"
          export AICEO_NO_BROWSER=1

          cd "$RUNNER_TEMP/cwd"
          "$RUNNER_TEMP/alone/AiCeo" > "$RUNNER_TEMP/alone.log" 2>&1 &
          APP_PID=$!

          READY=0
          for i in $(seq 1 45); do
            curl -fsS --max-time 3 http://127.0.0.1:5099/ -o "$RUNNER_TEMP/alone.html" && READY=1 && break
            kill -0 $APP_PID 2>/dev/null || break
            sleep 1
          done

          BLZ=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:5099/_framework/blazor.web.js)
          AGENTS=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:5099/api/agents)
          DIAG=$(curl -s --max-time 5 http://127.0.0.1:5099/api/diagnostics | head -c 900)
          LOG=$(tail -c 1600 "$RUNNER_TEMP/alone.log" | tr '\n' '|')

          echo "standalone: ready=$READY blazor=$BLZ agents=$AGENTS"
          cat "$RUNNER_TEMP/alone.log"

          kill $APP_PID 2>/dev/null
          sleep 1

          if [ "$READY" -ne 1 ] || [ "$BLZ" != "200" ] || [ "$AGENTS" != "200" ]; then
            echo "::error title=standalone-failed::ready=$READY blazor=$BLZ agents=$AGENTS diag=$DIAG log=$LOG"
            exit 1
          fi

      - name: Upgrade a v1.0.x database in place
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/legacy"
          python3 - <<'PY'
          import sqlite3, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "legacy", "v1.db")
          db = sqlite3.connect(path)
          db.executescript("""
              CREATE TABLE "Agents" (
                  "Id" TEXT NOT NULL CONSTRAINT "PK_Agents" PRIMARY KEY,
                  "Name" TEXT NOT NULL,
                  "Role" TEXT NOT NULL,
                  "SystemPrompt" TEXT NOT NULL,
                  "ModelId" TEXT NOT NULL,
                  "IsManager" INTEGER NOT NULL
              );
              INSERT INTO "Agents" VALUES ('11111111-1111-1111-1111-111111111111','Legacy','CEO','old prompt','gh/gpt-5.4-nano',1);
              CREATE TABLE "Tasks" (
                  "Id" TEXT NOT NULL CONSTRAINT "PK_Tasks" PRIMARY KEY,
                  "UserPrompt" TEXT NOT NULL,
                  "CeoPlan" TEXT NOT NULL,
                  "FinalOutput" TEXT NOT NULL,
                  "CreatedAt" TEXT NOT NULL
              );
              CREATE TABLE "TaskLogs" (
                  "Id" TEXT NOT NULL CONSTRAINT "PK_TaskLogs" PRIMARY KEY,
                  "TaskId" TEXT NOT NULL,
                  "AgentName" TEXT NOT NULL,
                  "Action" TEXT NOT NULL,
                  "Content" TEXT NOT NULL,
                  "CreatedAt" TEXT NOT NULL,
                  CONSTRAINT "FK_TaskLogs_Tasks_TaskId" FOREIGN KEY ("TaskId") REFERENCES "Tasks" ("Id") ON DELETE CASCADE
              );
          """)
          db.commit()
          db.close()
          print("legacy database written to", path, os.path.getsize(path), "bytes")
          PY

          export AICEO_DB_PATH="$RUNNER_TEMP/legacy/v1.db"
          export ASPNETCORE_URLS="http://127.0.0.1:5100"
          export AICEO_NO_BROWSER=1

          ./publish/AiCeo > "$RUNNER_TEMP/upgrade.log" 2>&1 &
          APP_PID=$!

          READY=0
          for i in $(seq 1 45); do
            curl -fsS --max-time 3 http://127.0.0.1:5100/api/agents -o "$RUNNER_TEMP/upgraded.json" && READY=1 && break
            kill -0 $APP_PID 2>/dev/null || break
            sleep 1
          done

          echo "--- upgraded agents ---"
          cat "$RUNNER_TEMP/upgraded.json"
          echo

          kill $APP_PID 2>/dev/null
          sleep 1

          if [ "$READY" -ne 1 ]; then
            echo "::error title=upgrade-failed::the app did not start on a v1.0.x database"
            tail -40 "$RUNNER_TEMP/upgrade.log"
            exit 1
          fi

          if ! grep -q '"name":"Legacy"' "$RUNNER_TEMP/upgraded.json"; then
            echo "::error title=upgrade-data::the legacy agent was not preserved"
            exit 1
          fi
          if ! grep -q '"provider":"OmniRoute"' "$RUNNER_TEMP/upgraded.json"; then
            echo "::error title=upgrade-column::the new Provider column was not populated"
            exit 1
          fi

  publish-matrix:
    name: Publish dry-run (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-x86
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish ${{ matrix.rid }}
        run: >-
          dotnet publish -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Verify the binary exists
        shell: bash
        run: |
          set -euo pipefail
          ls -la publish
          if [ -f publish/AiCeo.exe ]; then
            echo "produced publish/AiCeo.exe"
          elif [ -f publish/AiCeo ]; then
            echo "produced publish/AiCeo"
          else
            echo "::error title=missing-binary::dotnet publish produced no AiCeo binary for ${{ matrix.rid }}"
            exit 1
          fi

name: Diagnostics (temporary)

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  statuses: write

jobs:
  diag:
    name: Capture publish + runtime diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Prepare baseline copy
        shell: bash
        run: |
          set +e
          rm -rf "$RUNNER_TEMP/old"
          cp -r "$GITHUB_WORKSPACE" "$RUNNER_TEMP/old"
          cd "$RUNNER_TEMP/old"
          git show c641b1e:AiCeo.csproj > AiCeo.csproj
          git show c641b1e:Program.cs > Program.cs
          echo "baseline ready"

      - name: Publish variants
        shell: bash
        run: |
          set +e
          P="-c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true"
          dotnet publish AiCeo.csproj $P -o ./outA > "$RUNNER_TEMP/pubA.log" 2>&1; echo "A exit=$?"
          dotnet publish AiCeo.csproj $P -p:IncludeAllContentForSelfExtract=false -o ./outB > "$RUNNER_TEMP/pubB.log" 2>&1; echo "B exit=$?"
          cd "$RUNNER_TEMP/old"
          dotnet publish AiCeo.csproj $P -o "$RUNNER_TEMP/outC" > "$RUNNER_TEMP/pubC.log" 2>&1; echo "C exit=$?"
          ls "$RUNNER_TEMP/outC" | head

      - name: Run variants
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/logs" "$RUNNER_TEMP/data" "$RUNNER_TEMP/cwd"
          port=5088
          run() {
            name="$1"; dir="$2"
            echo "### $name ($dir)" > "$RUNNER_TEMP/logs/$name.txt"
            mkdir -p "$RUNNER_TEMP/appdir-$name"
            cp -r "$dir"/. "$RUNNER_TEMP/appdir-$name"/ 2>/dev/null
            cd "$RUNNER_TEMP/cwd"
            AICEO_DB_PATH="$RUNNER_TEMP/data/$name.db" ASPNETCORE_URLS="http://127.0.0.1:$port" \
              "$RUNNER_TEMP/appdir-$name/AiCeo" > "$RUNNER_TEMP/logs/$name-app.log" 2>&1 &
            pid=$!
            sleep 10
            if kill -0 "$pid" 2>/dev/null; then
              echo "alive=yes" >> "$RUNNER_TEMP/logs/$name.txt"
              echo "root=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:$port/)" >> "$RUNNER_TEMP/logs/$name.txt"
              echo "blazor=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:$port/_framework/blazor.web.js)" >> "$RUNNER_TEMP/logs/$name.txt"
              kill -9 "$pid" 2>/dev/null
            else
              wait "$pid"
              echo "alive=no exit=$?" >> "$RUNNER_TEMP/logs/$name.txt"
            fi
            echo "--- log ---" >> "$RUNNER_TEMP/logs/$name.txt"
            head -80 "$RUNNER_TEMP/logs/$name-app.log" >> "$RUNNER_TEMP/logs/$name.txt"
            port=$((port+1))
          }
          run A "$GITHUB_WORKSPACE/outA"
          run B "$GITHUB_WORKSPACE/outB"
          run C "$RUNNER_TEMP/outC"

      - name: Post diagnostics as commit statuses
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          cd "$RUNNER_TEMP"
          {
            for f in logs/A.txt logs/B.txt logs/C.txt logs/A-app.log logs/B-app.log logs/C-app.log pubA.log pubB.log pubC.log; do
              echo "=== $f ==="
              head -50 "$f" 2>/dev/null
            done
            echo "=== outA listing ==="
            ls "$GITHUB_WORKSPACE/outA" 2>/dev/null
            echo "=== outA wwwroot ==="
            find "$GITHUB_WORKSPACE/outA/wwwroot" -maxdepth 2 2>/dev/null | head -20
            echo "=== outC listing ==="
            ls "$RUNNER_TEMP/outC" 2>/dev/null
          } > "$RUNNER_TEMP/diag.txt" 2>&1
          wc -c "$RUNNER_TEMP/diag.txt"
          python3 - <<'PY'
          import json, os, urllib.request
          token, repo, sha = os.environ["TOKEN"], os.environ["REPO"], os.environ["SHA"]
          path = os.path.join(os.environ["RUNNER_TEMP"], "diag.txt")
          text = open(path, encoding="utf-8", errors="replace").read()
          print(text[:3000])
          chunks = [text[i:i+120].replace("\n", " ") for i in range(0, len(text), 120)][:40]
          for index, chunk in enumerate(chunks):
              payload = json.dumps({"state": "pending", "context": f"diag-{index:02d}", "description": chunk}).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/statuses/{sha}",
                  data=payload, method="POST",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req, timeout=20).read()
              except Exception as exc:
                  print("post failed", index, exc)
          PY

name: Diagnostics (temporary)
on:
  push:
    paths:
      - '.github/workflows/diag.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: macos-latest
    steps:
      - name: Report free space before cleanup
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice title=before::$(df -h / | tail -1)"
          echo "df: $(df -h / | tail -1)"

      - name: Biggest directories on /
        shell: bash
        run: |
          set -euo pipefail
          sudo du -x -d 1 -m / 2>/dev/null | sort -nr | head -10 | tr '\n' '|' | tee /tmp/top.txt
          echo "::notice title=top$$::$(cat /tmp/top.txt)"

      - name: Cleanup (same as release.yml)
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /Applications/Xcode*.app
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          sudo rm -rf /Library/Developer/CoreSimulator/Caches
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches
          sudo rm -rf ~/Library/Caches/Homebrew ~/Library/Caches/pip
          sudo rm -rf "$RUNNER_TEMP"/*
          FREE_MB=$(df -m / | awk 'NR==2{print $4}')
          echo "::notice title=after-cleanup::${FREE_MB} MB free ($(df -h / | tail -1))"

      - name: A - the existing hdiutil create -srcfolder recipe
        shell: bash
        run: |
          set -uo pipefail
          STAGE="$RUNNER_TEMP/stage-a"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          for i in $(seq 1 40); do dd if=/dev/zero of="$STAGE/part-$i.bin" bs=1m count=5 status=none; done
          ln -s /Applications "$STAGE/Applications"
          if OUT=$(hdiutil create -volname "AI CEO Orchestrator 1.0.16" -srcfolder "$STAGE" -ov -format UDZO "$RUNNER_TEMP/a.dmg" 2>&1); then
            echo "::notice title=A-ok::$(stat -f%z "$RUNNER_TEMP/a.dmg") bytes"
          else
            echo "::error title=A-failed::$(echo "$OUT" | tail -c 1200 | tr '\n' '|')"
          fi

      - name: B - explicit read/write image, step by step
        shell: bash
        run: |
          set -uo pipefail
          STAGE="$RUNNER_TEMP/stage-b"
          MNT="$RUNNER_TEMP/mnt-b"
          RW="$RUNNER_TEMP/b-rw.dmg"
          rm -rf "$STAGE" "$MNT" "$RW"; mkdir -p "$STAGE"
          for i in $(seq 1 40); do dd if=/dev/zero of="$STAGE/part-$i.bin" bs=1m count=5 status=none; done
          ln -s /Applications "$STAGE/Applications"

          step() {   # step <name> <command...>
            local name="$1"; shift
            local out
            if out=$("$@" 2>&1); then
              echo "::notice title=B-$name-ok::$(echo "$out" | tr '\n' '|' | tail -c 400)"
            else
              echo "::error title=B-$name-failed::$(echo "$out" | tail -c 1200 | tr '\n' '|')"
              return 1
            fi
          }

          step create hdiutil create -size 912m -fs HFS+ -volname "AI CEO Orchestrator 1.0.16" -ov "$RW" || exit 0
          ls -l "$RW" | tr -s ' ' | cut -d' ' -f5,9 | sed 's/^/::notice title=B-rwsize::/' || true
          mkdir -p "$MNT"
          step attach hdiutil attach "$RW" -nobrowse -noverify -mountpoint "$MNT" || exit 0
          step ditto ditto "$STAGE/" "$MNT/" || { hdiutil detach "$MNT" -force || true; exit 0; }
          echo "::notice title=B-mounted::$(du -sh "$MNT" | cut -f1) used, $(df -m "$MNT" | awk 'NR==2{print $4}') MB free in image"
          step detach hdiutil detach "$MNT" -force || exit 0
          step convert hdiutil convert "$RW" -format UDZO -imagekey zlib-level=9 -o "$RUNNER_TEMP/b.dmg" || exit 0
          step verify hdiutil verify "$RUNNER_TEMP/b.dmg" || exit 0
          echo "::notice title=B-final::$(stat -f%z "$RUNNER_TEMP/b.dmg") bytes"

      - name: C - free space while the real payload is staged
        shell: bash
        run: |
          set -uo pipefail
          df -h / | tail -1
          df -h "$RUNNER_TEMP" | tail -1
          echo "::notice title=C-tmpdir::RUNNER_TEMP=$RUNNER_TEMP free=$(df -m "$RUNNER_TEMP" | awk 'NR==2{print $4}') MB"
          echo "::notice title=C-tmproot::TMPDIR=$TMPDIR free=$(df -m "${TMPDIR:-/tmp}" | awk 'NR==2{print $4}') MB"
          mount | grep -E " on / " | sed 's/^/::notice title=C-mount::/'

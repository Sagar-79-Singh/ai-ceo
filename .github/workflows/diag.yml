name: Diagnostics (temporary)

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  statuses: write

jobs:
  diag:
    name: Capture publish + runtime diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
        continue-on-error: true

      - name: Prepare baseline copy
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf "$RUNNER_TEMP/old"
          cp -r "$GITHUB_WORKSPACE" "$RUNNER_TEMP/old"
          cd "$RUNNER_TEMP/old"
          git show c641b1e:AiCeo.csproj > AiCeo.csproj 2> "$RUNNER_TEMP/baseline.err"
          git show c641b1e:Program.cs > Program.cs 2>> "$RUNNER_TEMP/baseline.err"
          wc -c AiCeo.csproj Program.cs >> "$RUNNER_TEMP/baseline.err"
          exit 0

      - name: Publish variants
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ulimit -c 0
          P="-c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true"
          dotnet publish AiCeo.csproj $P -o ./outA > "$RUNNER_TEMP/pubA.log" 2>&1; echo "A exit=$?"
          dotnet publish AiCeo.csproj $P -p:IncludeAllContentForSelfExtract=false -o ./outB > "$RUNNER_TEMP/pubB.log" 2>&1; echo "B exit=$?"
          cd "$RUNNER_TEMP/old"
          dotnet publish AiCeo.csproj $P -o "$RUNNER_TEMP/outC" > "$RUNNER_TEMP/pubC.log" 2>&1; echo "C exit=$?"
          cd "$GITHUB_WORKSPACE"
          dotnet publish AiCeo.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -o ./outD > "$RUNNER_TEMP/pubD.log" 2>&1; echo "D exit=$?"
          dotnet build AiCeo.csproj -c Release > "$RUNNER_TEMP/buildE.log" 2>&1; echo "E exit=$?"
          exit 0

      - name: Run variants
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ulimit -c 0
          mkdir -p "$RUNNER_TEMP/logs" "$RUNNER_TEMP/data" "$RUNNER_TEMP/cwd"

          run_exe() {
            name="$1"; exe="$2"
            echo "### $name -> $exe"
            cd "$RUNNER_TEMP/cwd"
            AICEO_DB_PATH="$RUNNER_TEMP/data/$name.db" ASPNETCORE_URLS="http://127.0.0.1:$port" \
              "$exe" > "$RUNNER_TEMP/logs/$name-app.log" 2>&1 &
            pid=$!
            sleep 10
            if kill -0 "$pid" 2>/dev/null; then
              echo "alive=yes"
              echo "root=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:$port/)"
              echo "blazor=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:$port/_framework/blazor.web.js)"
              kill -9 "$pid" 2>/dev/null
            else
              wait "$pid"
              echo "alive=no exit=$?"
            fi
            echo "--- app log ($name) ---"
            head -60 "$RUNNER_TEMP/logs/$name-app.log"
            port=$((port+1))
          }

          port=5088
          run_exe A "$GITHUB_WORKSPACE/outA/AiCeo"
          run_exe B "$GITHUB_WORKSPACE/outB/AiCeo"
          run_exe C "$RUNNER_TEMP/outC/AiCeo"
          run_exe D "$GITHUB_WORKSPACE/outD/AiCeo"
          run_exe F "$GITHUB_WORKSPACE/outA/AiCeo"
          exit 0

      - name: Post diagnostics as commit statuses
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          cd "$RUNNER_TEMP"
          {
            for f in logs/*.log baseline.err; do
              echo "=== $f ==="
              tail -c 2000 "$f" 2>/dev/null
            done
            echo "=== outA listing ==="
            ls "$GITHUB_WORKSPACE/outA" 2>/dev/null | head -20
            echo "=== outD listing ==="
            ls "$GITHUB_WORKSPACE/outD" 2>/dev/null | head -20
            echo "=== extraction ==="
            find /tmp/.net -maxdepth 4 2>/dev/null | head -30
          } > "$RUNNER_TEMP/diag.txt" 2>&1
          wc -c "$RUNNER_TEMP/diag.txt"
          python3 - <<'PY'
          import json, os, urllib.request
          token, repo, sha = os.environ["TOKEN"], os.environ["REPO"], os.environ["SHA"]
          path = os.path.join(os.environ["RUNNER_TEMP"], "diag.txt")
          text = open(path, encoding="utf-8", errors="replace").read()
          print(text[:4000])
          chunks = [text[i:i+120].replace("\n", " ") for i in range(0, len(text), 120)][:60]
          for index, chunk in enumerate(chunks):
              payload = json.dumps({"state": "pending", "context": f"diag-{index:02d}", "description": chunk}).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/statuses/{sha}",
                  data=payload, method="POST",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req, timeout=20).read()
              except Exception as exc:
                  print("post failed", index, exc)
          PY
          exit 0

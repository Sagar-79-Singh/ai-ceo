name: Diagnostics (temporary)
on:
  push:
    paths:
      - '.github/workflows/diag.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: macos-latest
    steps:
      - name: Report free space before cleanup
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice title=before::$(df -h / | tail -1)"
          echo "df: $(df -h / | tail -1)"

      - name: Biggest directories on /
        shell: bash
        run: |
          set -euo pipefail
          sudo du -x -d 1 -m / 2>/dev/null | sort -nr | head -10 | tr '\n' '|' | tee /tmp/top.txt
          echo "::notice title=top$$::$(cat /tmp/top.txt)"

      - name: Cleanup (same as release.yml)
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /Applications/Xcode*.app
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          sudo rm -rf /Library/Developer/CoreSimulator/Caches
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches
          sudo rm -rf ~/Library/Caches/Homebrew ~/Library/Caches/pip
          sudo rm -rf "$RUNNER_TEMP"/*
          FREE_MB=$(df -m / | awk 'NR==2{print $4}')
          echo "::notice title=after-cleanup::${FREE_MB} MB free ($(df -h / | tail -1))"

      - name: Build a 200 MB compressed image the way release.yml does
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage"
          MNT="$RUNNER_TEMP/mnt"
          RW="$RUNNER_TEMP/rw.dmg"
          rm -rf "$STAGE" "$MNT"
          mkdir -p "$STAGE"
          for i in $(seq 1 40); do
            dd if=/dev/zero of="$STAGE/part-$i.bin" bs=1m count=5 status=none
          done
          ln -s /Applications "$STAGE/Applications"
          PAYLOAD_MB=$(du -sm "$STAGE" | cut -f1)
          IMAGE_MB=$(( PAYLOAD_MB * 2 + 512 ))
          echo "::notice title=payload::${PAYLOAD_MB} MB payload, ${IMAGE_MB} MB image"
          hdiutil create -size "${IMAGE_MB}m" -fs HFS+ -volname "AI CEO Orchestrator 1.0.16" -format UDRW -ov "$RW"
          mkdir -p "$MNT"
          hdiutil attach "$RW" -nobrowse -noverify -mountpoint "$MNT"
          ditto "$STAGE/" "$MNT/"
          sync
          du -sh "$MNT"
          hdiutil detach "$MNT" -force
          hdiutil convert "$RW" -format UDZO -imagekey zlib-level=9 -o "$RUNNER_TEMP/out.dmg"
          hdiutil verify "$RUNNER_TEMP/out.dmg"
          echo "::notice title=image::$(stat -f%z "$RUNNER_TEMP/out.dmg") bytes, koly=$(tail -c 512 "$RUNNER_TEMP/out.dmg" | head -c 4), free $(df -m / | awk 'NR==2{print $4}') MB"

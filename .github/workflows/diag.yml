name: Diagnostics (temporary)

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  statuses: write

jobs:
  diag:
    name: Capture publish + runtime diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish two variants
        shell: bash
        run: |
          dotnet publish AiCeo.csproj -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./outA > /dev/null
          dotnet publish AiCeo.csproj -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=false -o ./outB > /dev/null

      - name: Collect
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/data"
          {
            port=5088
            for variant in A B; do
              echo "### variant $variant"
              echo "-- runtime log --"
              AICEO_DB_PATH="$RUNNER_TEMP/data/$variant.db" ASPNETCORE_URLS="http://127.0.0.1:$port" \
                timeout 25 "./out$variant/AiCeo" > "$RUNNER_TEMP/$variant.log" 2>&1
              echo "exit=$?"
              head -60 "$RUNNER_TEMP/$variant.log"
              echo "-- end log --"
              port=$((port+1))
            done
            echo "### publishA top level"
            ls ./outA
            echo "### publishA wwwroot"
            find ./outA/wwwroot -maxdepth 2 2>/dev/null | head -20
          } > "$RUNNER_TEMP/diag.txt" 2>&1

      - name: Post diagnostics as commit statuses
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token, repo, sha = os.environ["TOKEN"], os.environ["REPO"], os.environ["SHA"]
          path = os.path.join(os.environ["RUNNER_TEMP"], "diag.txt")
          text = open(path, encoding="utf-8", errors="replace").read() if os.path.exists(path) else "no diag file"
          print(text)
          chunks = [text[i:i+120].replace("\n", " ") for i in range(0, len(text), 120)][:30]
          for index, chunk in enumerate(chunks):
              payload = json.dumps({"state": "pending", "context": f"diag-{index:02d}", "description": chunk}).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/statuses/{sha}",
                  data=payload, method="POST",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req, timeout=20).read()
              except Exception as exc:
                  print("post failed", index, exc)
          PY

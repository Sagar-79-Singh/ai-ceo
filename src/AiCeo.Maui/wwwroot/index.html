<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>AI CEO Orchestrator</title>

    <link rel="stylesheet" href="css/app.css" />

    <style>
        /* Instant dark paint so the native window never flashes white. */
        html, body {
            margin: 0;
            height: 100%;
            background: #080b11;
            color: #e9f0fa;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        #boot {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            gap: 10px;
            align-content: center;
            color: #8ea3bd;
            font-size: 13px;
            letter-spacing: 0.04em;
        }

        #boot .mark {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            background: linear-gradient(135deg, #5ee0b0, #3fb8ff 70%, #9aa8ff);
            display: grid;
            place-items: center;
            color: #04140f;
            font-weight: 800;
            margin: 0 auto 4px;
        }

        #blazor-error-ui {
            display: none;
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="boot">
            <div class="mark">AI</div>
            <div>Starting the orchestrator…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong in the UI. Check the workspace or provider settings and restart the app.
    </div>

    <script src="js/app.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
